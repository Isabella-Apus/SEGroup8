server:
  port: 8080
  tomcat:
    max-swallow-size: -1
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

spring:
  application:
    name: segroup8-platform
  config:
    import: optional:classpath:application-local.yml
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: "${DB_URL:jdbc:mysql://127.0.0.1:3306/segroup8_platform?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true}"
    username: "${DB_USERNAME:root}"
    password: "${DB_PASSWORD:root}"
    hikari:
      connection-init-sql: SET NAMES utf8mb4 COLLATE utf8mb4_general_ci
  sql:
    init:
      mode: never
      encoding: UTF-8
  servlet:
    multipart:
      max-file-size: 200MB
      max-request-size: 220MB

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

app:
  jwt:
    secret: "${JWT_SECRET:SEGROUP8_DEMO_SECRET_KEY_CHANGE_ME_2026}"
    expire-hours: 24
  realtime:
    allowed-origin-patterns: "${REALTIME_ALLOWED_ORIGIN_PATTERNS:*}"
  idempotency:
    cleanup-fixed-delay-ms: 60000
  upload:
    dir: uploads
  risk-audit:
    llm:
      enabled: true
      api-key: "${RISK_AUDIT_LLM_API_KEY:${OPENAI_API_KEY:}}"
      model: gpt-5.4
      endpoint: "${RISK_AUDIT_LLM_ENDPOINT:https://ai-pixel.online/v1/responses}"
      base-url: "${RISK_AUDIT_LLM_BASE_URL:https://ai-pixel.online}"
      wire-api: responses
      disable-response-storage: true
      timeout-seconds: 12

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
      group:
        liveness:
          include: livenessState,ping
        readiness:
          include: readinessState,db
  info:
    env:
      enabled: true

info:
  app:
    name: "${spring.application.name}"
    version: "${APP_VERSION:0.0.1-SNAPSHOT}"
    commit: "${APP_COMMIT:unknown}"
    build-time: "${APP_BUILD_TIME:unknown}"
