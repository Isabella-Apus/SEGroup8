spring:
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:segroup8_test;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_UPPER=false;NON_KEYWORDS=USER
    username: sa
    password:
    hikari:
      connection-init-sql:
  sql:
    init:
      mode: always
      encoding: UTF-8
      schema-locations: classpath:schema-test.sql
      data-locations: classpath:data-test.sql

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

app:
  jwt:
    secret: SEGROUP8_DEMO_SECRET_KEY_CHANGE_ME_2026
    expire-hours: 24
  upload:
    dir: uploads
  internal-service:
    token: test-internal-service-token
  messaging:
    event-notifications-enabled: false
  outbox:
    relay-delay-ms: 3600000
  risk-audit:
    llm:
      enabled: false
