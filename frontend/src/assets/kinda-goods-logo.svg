<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 280" role="img" aria-labelledby="title desc">
  <title id="title">Kinda Goods Logo</title>
  <desc id="desc">A smiling shopping bag inside circular exchange arrows with the Kinda Goods wordmark.</desc>
  <defs>
