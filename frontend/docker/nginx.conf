server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 220m;

    location = /health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    location = /api/category/tree { proxy_pass http://segroup8-catalog-shop:8080; include /etc/nginx/proxy_params; }
    location ^~ /api/product/ { proxy_pass http://segroup8-catalog-shop:8080; include /etc/nginx/proxy_params; }
    location ^~ /api/shop/ { proxy_pass http://segroup8-catalog-shop:8080; include /etc/nginx/proxy_params; }
    location ^~ /api/admin/product-risk-audits { proxy_pass http://segroup8-catalog-shop:8080; include /etc/nginx/proxy_params; }
    location ^~ /api/user/browse-history { proxy_pass http://segroup8-catalog-shop:8080; include /etc/nginx/proxy_params; }
    location ^~ /api/search/ { proxy_pass http://segroup8-catalog-shop:8080; include /etc/nginx/proxy_params; }

    # Messaging owns only chat and notification paths. Keep all other API calls
    # on the monolith backend during the incremental migration.
    location ~ ^/api/(chat|notifications)(/|$) {
        proxy_pass http://messaging:8084;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location /uploads/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
    }

    location = /ws/realtime {
        proxy_pass http://messaging:8084;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    location /ws/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
