server:
  port: ${SERVER_PORT:8081}
spring:
  application:
    name: catalog-service
  datasource:
    url: ${DB_URL:jdbc:mysql://mysql:3306/catalog_schema?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai}
    username: ${DB_USERNAME:catalog}
    password: ${DB_PASSWORD:catalog}
  sql:
    init:
      mode: always
management:
  endpoints.web.exposure.include: health,info
  endpoint.health.probes.enabled: true
springdoc:
  swagger-ui.path: /swagger-ui.html
clients:
  risk-base-url: ${RISK_BASE_URL:http://risk-service:8083}
