server:
  port: ${SERVER_PORT:8084}
spring:
  application:
    name: messaging-service
  main:
    banner-mode: off
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/messaging_db?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:messaging_app}
    # Production credentials are injected by a Secret; no repository password fallback.
    password: ${DB_PASSWORD:}
    hikari:
      connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:3000}
      validation-timeout: ${DB_VALIDATION_TIMEOUT_MS:1000}
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-migration-naming: true
management:
  endpoints.web.exposure.include: health,info,metrics,prometheus
  endpoint.health.probes.enabled: true
  endpoint.health.group.liveness.include: livenessState
  endpoint.health.group.readiness.include: readinessState,db
info:
  app:
    name: messaging-service
    version: ${APP_VERSION:dev}
    commit: ${APP_COMMIT:unknown}
    build-time: ${APP_BUILD_TIME:unknown}
springdoc.swagger-ui.path: /swagger-ui.html
app:
  jwt.secret: ${JWT_SECRET:}
  realtime.allowed-origin-patterns: ${REALTIME_ALLOWED_ORIGIN_PATTERNS:http://localhost:5174}
  governance.identity-base-url: ${IDENTITY_SERVICE_URL:${GOVERNANCE_BASE_URL:http://127.0.0.1:8080}}
  governance.service-token: ${IDENTITY_SERVICE_TOKEN:${INTERNAL_SERVICE_TOKEN:}}
  governance.connect-timeout-ms: ${IDENTITY_CONNECT_TIMEOUT_MS:2000}
  governance.read-timeout-ms: ${IDENTITY_READ_TIMEOUT_MS:3000}
  governance.max-attempts: ${IDENTITY_MAX_ATTEMPTS:3}
  governance.retry-backoff-ms: ${IDENTITY_RETRY_BACKOFF_MS:100}
  internal-service.token: ${INTERNAL_SERVICE_TOKEN:}
  internal-service.operations-token: ${INTERNAL_OPERATIONS_TOKEN:}
  inbox:
    poll-delay-ms: ${INBOX_POLL_DELAY_MS:1000}
    max-retries: ${INBOX_MAX_RETRIES:5}
  delivery:
    poll-delay-ms: ${DELIVERY_POLL_DELAY_MS:1000}
    max-retries: ${DELIVERY_MAX_RETRIES:5}
logging:
  pattern:
    level: "%5p [traceId:%X{traceId} requestId:%X{requestId}]"
  level:
    org.springframework.web.servlet.DispatcherServlet: INFO
    org.springframework.web.socket.server.support.WebSocketHttpRequestHandler: INFO
    org.springframework.web.socket.handler.LoggingWebSocketHandlerDecorator: INFO
    # MVC DEBUG body logging can expose event snapshot/notification text.
    org.springframework.web.servlet.mvc.method.annotation.RequestResponseBodyMethodProcessor: INFO
    org.springframework.web.servlet.mvc.method.annotation.HttpEntityMethodProcessor: INFO
