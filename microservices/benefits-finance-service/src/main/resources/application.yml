server:
  port: ${SERVER_PORT:8085}
  shutdown: graceful
spring:
  application:
    name: benefits-finance-service
  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/benefits_finance_db?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:benefits_finance_app}
    password: ${DB_PASSWORD:}
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-migration-naming: true
    user: ${FLYWAY_DB_USERNAME:${DB_USERNAME:benefits_finance_app}}
    password: ${FLYWAY_DB_PASSWORD:${DB_PASSWORD:}}
  lifecycle:
    timeout-per-shutdown-phase: 20s
app:
  internal-service-token: ${INTERNAL_SERVICE_TOKEN:change-me-in-kubernetes}
  jwt-secret: ${JWT_SECRET:change-me-in-kubernetes-jwt-secret}
  currency: ${CURRENCY:CNY}
  quote-ttl-seconds: ${QUOTE_TTL_SECONDS:300}
  reservation-ttl-seconds: ${RESERVATION_TTL_SECONDS:900}
  outbox-event-sink-url: ${OUTBOX_EVENT_SINK_URL:}
  outbox-poll-ms: ${OUTBOX_POLL_MS:5000}
  outbox-batch-size: ${OUTBOX_BATCH_SIZE:50}
  outbox-max-attempts: ${OUTBOX_MAX_ATTEMPTS:8}
  http-connect-timeout-ms: ${HTTP_CONNECT_TIMEOUT_MS:1000}
  http-read-timeout-ms: ${HTTP_READ_TIMEOUT_MS:3000}
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db,financeSchema,secrets
  info:
    env:
      enabled: true
info:
  app:
    name: benefits-finance-service
    version: ${APP_VERSION:dev}
    commit: ${APP_COMMIT:unknown}
    buildTime: ${APP_BUILD_TIME:unknown}
springdoc:
  swagger-ui:
    path: /swagger-ui.html
