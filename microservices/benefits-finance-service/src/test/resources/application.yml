spring:
  datasource:
    url: jdbc:h2:mem:benefits;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
  flyway:
    enabled: true
app:
  internal-service-token: test-internal-token
  jwt-secret: SEGROUP8_TEST_SECRET_KEY_AT_LEAST_32_BYTES_LONG
  currency: CNY
  quote-ttl-seconds: 300
  reservation-ttl-seconds: 900
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db,financeSchema,secrets
  info:
    env:
      enabled: true
info:
  app:
    name: benefits-finance-service
    version: test
    commit: test-commit
    buildTime: 2026-08-30T00:00:00Z
logging:
  level:
    root: WARN
