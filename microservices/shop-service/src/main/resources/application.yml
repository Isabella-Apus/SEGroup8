server.port: ${SERVER_PORT:8082}
spring:
  application.name: shop-service
  datasource:
    url: ${DB_URL:jdbc:mysql://mysql:3306/shop_schema?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai}
    username: ${DB_USERNAME:shop}
    password: ${DB_PASSWORD:shop}
  sql.init.mode: always
management:
  endpoints.web.exposure.include: health,info
  endpoint.health.probes.enabled: true
clients.catalog-base-url: ${CATALOG_BASE_URL:http://catalog-service:8081}
