apiVersion: apps/v1
kind: Deployment
metadata: {name: behavior-service}
spec:
  replicas: 2
  selector: {matchLabels: {app: behavior-service}}
  template:
    metadata: {labels: {app: behavior-service}}
    spec:
      containers:
        - name: behavior
          image: se-group8/behavior-service:1.0.0
          imagePullPolicy: IfNotPresent
          ports: [{containerPort: 8084}]
          env:
            - {name: DB_URL, value: "jdbc:mysql://mysql:3306/behavior_schema?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai"}
            - {name: DB_USERNAME, value: behavior}
            - name: DB_PASSWORD
              valueFrom: {secretKeyRef: {name: commerce-db-secret, key: behavior-password}}
          startupProbe: {httpGet: {path: /actuator/health, port: 8084}, failureThreshold: 30, periodSeconds: 5}
          readinessProbe: {httpGet: {path: /actuator/health/readiness, port: 8084}, periodSeconds: 5}
          livenessProbe: {httpGet: {path: /actuator/health/liveness, port: 8084}, periodSeconds: 10}
          resources: {requests: {cpu: 100m, memory: 192Mi}, limits: {cpu: 500m, memory: 512Mi}}
---
apiVersion: v1
kind: Service
metadata: {name: behavior-service}
spec:
  selector: {app: behavior-service}
  ports: [{port: 8084, targetPort: 8084}]
