apiVersion: apps/v1
kind: Deployment
metadata: {name: catalog-service}
spec:
  replicas: 2
  selector: {matchLabels: {app: catalog-service}}
  template:
    metadata: {labels: {app: catalog-service}}
    spec:
      containers:
        - name: catalog
          image: se-group8/catalog-service:1.0.0
          imagePullPolicy: IfNotPresent
          ports: [{containerPort: 8081}]
          env:
            - {name: DB_URL, value: "jdbc:mysql://mysql:3306/catalog_schema?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai"}
            - {name: DB_USERNAME, value: catalog}
            - name: DB_PASSWORD
              valueFrom: {secretKeyRef: {name: commerce-db-secret, key: catalog-password}}
            - {name: RISK_BASE_URL, value: "http://risk-service:8083"}
          startupProbe: {httpGet: {path: /actuator/health, port: 8081}, failureThreshold: 30, periodSeconds: 5}
          readinessProbe: {httpGet: {path: /actuator/health/readiness, port: 8081}, periodSeconds: 5}
          livenessProbe: {httpGet: {path: /actuator/health/liveness, port: 8081}, periodSeconds: 10}
          resources: {requests: {cpu: 100m, memory: 192Mi}, limits: {cpu: 500m, memory: 512Mi}}
---
apiVersion: v1
kind: Service
metadata: {name: catalog-service}
spec:
  selector: {app: catalog-service}
  ports: [{port: 8081, targetPort: 8081}]
