apiVersion: v1
kind: ConfigMap
metadata:
  name: mysql-init
data:
  01-schemas.sh: |
    #!/bin/sh
    mysql -uroot -p"$MYSQL_ROOT_PASSWORD" <<SQL
    CREATE DATABASE IF NOT EXISTS catalog_schema CHARACTER SET utf8mb4;
    CREATE DATABASE IF NOT EXISTS shop_schema CHARACTER SET utf8mb4;
    CREATE DATABASE IF NOT EXISTS risk_schema CHARACTER SET utf8mb4;
    CREATE DATABASE IF NOT EXISTS behavior_schema CHARACTER SET utf8mb4;
    CREATE USER IF NOT EXISTS 'catalog'@'%' IDENTIFIED BY '$CATALOG_PASSWORD';
    CREATE USER IF NOT EXISTS 'shop'@'%' IDENTIFIED BY '$SHOP_PASSWORD';
    CREATE USER IF NOT EXISTS 'risk'@'%' IDENTIFIED BY '$RISK_PASSWORD';
    CREATE USER IF NOT EXISTS 'behavior'@'%' IDENTIFIED BY '$BEHAVIOR_PASSWORD';
    GRANT ALL ON catalog_schema.* TO 'catalog'@'%';
    GRANT ALL ON shop_schema.* TO 'shop'@'%';
    GRANT ALL ON risk_schema.* TO 'risk'@'%';
    GRANT ALL ON behavior_schema.* TO 'behavior'@'%';
    SQL
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mysql-data
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql
spec:
  replicas: 1
  selector:
    matchLabels: {app: mysql}
  template:
    metadata:
      labels: {app: mysql}
    spec:
      containers:
        - name: mysql
          image: mysql:8.4.6
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom: {secretKeyRef: {name: commerce-db-secret, key: root-password}}
            - name: CATALOG_PASSWORD
              valueFrom: {secretKeyRef: {name: commerce-db-secret, key: catalog-password}}
            - name: SHOP_PASSWORD
              valueFrom: {secretKeyRef: {name: commerce-db-secret, key: shop-password}}
            - name: RISK_PASSWORD
              valueFrom: {secretKeyRef: {name: commerce-db-secret, key: risk-password}}
            - name: BEHAVIOR_PASSWORD
              valueFrom: {secretKeyRef: {name: commerce-db-secret, key: behavior-password}}
          ports: [{containerPort: 3306}]
          readinessProbe: {exec: {command: ["sh","-c","mysqladmin ping -h 127.0.0.1 -uroot -p$MYSQL_ROOT_PASSWORD"]}, initialDelaySeconds: 15, periodSeconds: 5}
          resources:
            requests: {cpu: 200m, memory: 384Mi}
            limits: {cpu: "1", memory: 1Gi}
          volumeMounts:
            - {name: data, mountPath: /var/lib/mysql}
            - {name: init, mountPath: /docker-entrypoint-initdb.d}
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: mysql-data}
        - name: init
          configMap: {name: mysql-init, defaultMode: 0755}
---
apiVersion: v1
kind: Service
metadata:
  name: mysql
spec:
  selector: {app: mysql}
  ports: [{port: 3306, targetPort: 3306}]
