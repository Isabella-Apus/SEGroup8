apiVersion: apps/v1
kind: Deployment
metadata: {name: risk-service}
spec:
  replicas: 2
  selector: {matchLabels: {app: risk-service}}
  template:
    metadata: {labels: {app: risk-service}}
    spec:
      containers:
        - name: risk
          image: se-group8/risk-service:1.0.0
          imagePullPolicy: IfNotPresent
          ports: [{containerPort: 8083}]
          env:
            - {name: DB_URL, value: "jdbc:mysql://mysql:3306/risk_schema?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai"}
            - {name: DB_USERNAME, value: risk}
            - name: DB_PASSWORD
              valueFrom: {secretKeyRef: {name: commerce-db-secret, key: risk-password}}
            - {name: CATALOG_BASE_URL, value: "http://catalog-service:8081"}
          startupProbe: {httpGet: {path: /actuator/health, port: 8083}, failureThreshold: 30, periodSeconds: 5}
          readinessProbe: {httpGet: {path: /actuator/health/readiness, port: 8083}, periodSeconds: 5}
          livenessProbe: {httpGet: {path: /actuator/health/liveness, port: 8083}, periodSeconds: 10}
          resources: {requests: {cpu: 100m, memory: 192Mi}, limits: {cpu: 500m, memory: 512Mi}}
---
apiVersion: v1
kind: Service
metadata: {name: risk-service}
spec:
  selector: {app: risk-service}
  ports: [{port: 8083, targetPort: 8083}]
