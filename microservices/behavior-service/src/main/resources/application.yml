server.port: ${SERVER_PORT:8084}
spring:
  application.name: behavior-service
  datasource:
    url: ${DB_URL:jdbc:mysql://mysql:3306/behavior_schema?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai}
    username: ${DB_USERNAME:behavior}
    password: ${DB_PASSWORD:behavior}
  sql.init.mode: always
management:
  endpoints.web.exposure.include: health,info
  endpoint.health.probes.enabled: true
