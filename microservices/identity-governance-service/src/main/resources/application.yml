server:
  port: ${SERVER_PORT:8091}
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

spring:
  application:
    name: identity-governance-service
  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/identity_governance_db?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:identity_governance_app}
    password: ${DB_PASSWORD}
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-migration-naming: true

app:
  jwt-secret: ${JWT_SECRET}
  access-token-minutes: ${ACCESS_TOKEN_MINUTES:30}
  internal-service-token: ${INTERNAL_SERVICE_TOKEN}
  outbox:
    enabled: ${OUTBOX_PUBLISHER_ENABLED:true}
    catalog-url: ${CATALOG_SHOP_SERVICE_URL:http://segroup8-catalog-shop:8080}
    messaging-url: ${MESSAGING_SERVICE_URL:http://messaging:8084}
    publish-ms: ${OUTBOX_PUBLISH_MS:5000}
    max-attempts: ${OUTBOX_MAX_ATTEMPTS:10}
    connect-timeout-ms: ${OUTBOX_CONNECT_TIMEOUT_MS:1500}
    read-timeout-ms: ${OUTBOX_READ_TIMEOUT_MS:2500}
  bootstrap-admin:
    username: ${BOOTSTRAP_ADMIN_USERNAME:admin}
    password: ${BOOTSTRAP_ADMIN_PASSWORD:}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState,ping
        readiness:
          include: readinessState,db
  info:
    env:
      enabled: true

info:
  app:
    name: ${spring.application.name}
    version: ${APP_VERSION:1.0.0-SNAPSHOT}
    git:
      commit: ${APP_COMMIT:unknown}
    build:
      time: ${APP_BUILD_TIME:unknown}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
