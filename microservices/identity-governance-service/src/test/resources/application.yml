spring:
  datasource:
    url: jdbc:h2:mem:identity;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
  flyway:
    enabled: true
  main:
    banner-mode: off

app:
  outbox:
    enabled: false
  jwt-secret: test-jwt-secret-with-at-least-32-bytes-2026
  access-token-minutes: 30
  internal-service-token: test-internal-service-token
  bootstrap-admin:
    password: ""

logging:
  level:
    root: WARN
