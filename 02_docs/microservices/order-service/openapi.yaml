openapi: 3.0.3
info:
  title: SEGroup8 order-service API
  version: 1.0.0
servers:
  - url: /
security:
  - bearerAuth: []
paths:
  /api/order/create:
    post:
      operationId: createOrder
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/CreateOrderRequest'}}}
      responses: {'200': {$ref: '#/components/responses/OrderResponse'}, '400': {$ref: '#/components/responses/ErrorResponse'}, '503': {$ref: '#/components/responses/ErrorResponse'}}
  /api/order/list:
    get:
      operationId: listBuyerOrders
      parameters: [{$ref: '#/components/parameters/PageNum'}, {$ref: '#/components/parameters/PageSize'}]
      responses: {'200': {$ref: '#/components/responses/OrderPageResponse'}}
  /api/order/detail/{orderId}:
    get:
      operationId: getBuyerOrder
      parameters: [{$ref: '#/components/parameters/OrderId'}]
      responses: {'200': {$ref: '#/components/responses/OrderResponse'}, '403': {$ref: '#/components/responses/ErrorResponse'}, '404': {$ref: '#/components/responses/ErrorResponse'}}
  /api/order/{orderId}/pay:
    post:
      operationId: payOrder
      parameters: [{$ref: '#/components/parameters/OrderId'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      responses: {'200': {$ref: '#/components/responses/OrderResponse'}, '503': {$ref: '#/components/responses/ErrorResponse'}}
  /api/order/{orderId}/cancel:
    post:
      operationId: cancelOrder
      parameters: [{$ref: '#/components/parameters/OrderId'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      responses: {'200': {$ref: '#/components/responses/OrderResponse'}, '503': {$ref: '#/components/responses/ErrorResponse'}}
  /api/order/{orderId}/ship:
    post:
      operationId: shipOrder
      parameters: [{$ref: '#/components/parameters/OrderId'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      responses: {'200': {$ref: '#/components/responses/OrderResponse'}, '409': {$ref: '#/components/responses/ErrorResponse'}}
  /api/order/{orderId}/remind-ship:
    post:
      operationId: remindShipment
      parameters: [{$ref: '#/components/parameters/OrderId'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      responses: {'200': {$ref: '#/components/responses/SuccessResponse'}}
  /api/order/{orderId}/confirm-receive:
    post:
      operationId: confirmReceipt
      parameters: [{$ref: '#/components/parameters/OrderId'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      responses: {'200': {$ref: '#/components/responses/OrderResponse'}, '503': {$ref: '#/components/responses/ErrorResponse'}}
  /api/order/{orderId}/complete:
    post:
      operationId: completeOrder
      parameters: [{$ref: '#/components/parameters/OrderId'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      responses: {'200': {$ref: '#/components/responses/OrderResponse'}}
  /api/order/{orderId}/refund:
    post:
      operationId: requestRefund
      parameters: [{$ref: '#/components/parameters/OrderId'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      responses: {'200': {$ref: '#/components/responses/OrderResponse'}}
  /api/order/{orderId}/refund/approve:
    post:
      operationId: approveSellerRefund
      parameters: [{$ref: '#/components/parameters/OrderId'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      responses: {'200': {$ref: '#/components/responses/OrderResponse'}, '503': {$ref: '#/components/responses/ErrorResponse'}}
  /api/order/{orderId}/refund/reject:
    post:
      operationId: rejectSellerRefund
      parameters: [{$ref: '#/components/parameters/OrderId'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      responses: {'200': {$ref: '#/components/responses/OrderResponse'}}
  /api/order/seller/list:
    get:
      operationId: listSellerOrders
      parameters: [{$ref: '#/components/parameters/PageNum'}, {$ref: '#/components/parameters/PageSize'}]
      responses: {'200': {$ref: '#/components/responses/OrderPageResponse'}}
  /api/order/seller/detail/{orderId}:
    get:
      operationId: getSellerOrder
      parameters: [{$ref: '#/components/parameters/OrderId'}]
      responses: {'200': {$ref: '#/components/responses/OrderResponse'}}
  /api/order/{orderId}/review:
    post:
      operationId: reviewWholeOrder
      parameters: [{$ref: '#/components/parameters/OrderId'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      responses: {'200': {$ref: '#/components/responses/OrderResponse'}}
  /api/order/{orderId}/review/items:
    post:
      operationId: reviewOrderItems
      parameters: [{$ref: '#/components/parameters/OrderId'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      responses: {'200': {$ref: '#/components/responses/OrderResponse'}}
  /api/review/my:
    get:
      operationId: listMyReviews
      parameters: [{$ref: '#/components/parameters/PageNum'}, {$ref: '#/components/parameters/PageSize'}]
      responses: {'200': {$ref: '#/components/responses/SuccessResponse'}}
  /api/review/seller/list:
    get:
      operationId: listSellerReviews
      parameters: [{$ref: '#/components/parameters/PageNum'}, {$ref: '#/components/parameters/PageSize'}]
      responses: {'200': {$ref: '#/components/responses/SuccessResponse'}}
  /api/review/followup:
    post:
      operationId: followUpReview
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      responses: {'200': {$ref: '#/components/responses/SuccessResponse'}}
  /api/review/{reviewId}/reply:
    post:
      operationId: replyReview
      parameters: [{$ref: '#/components/parameters/ReviewId'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      responses: {'200': {$ref: '#/components/responses/SuccessResponse'}}
  /api/review/seller/{reviewId}/reply:
    post:
      operationId: replySellerReview
      parameters: [{$ref: '#/components/parameters/ReviewId'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      responses: {'200': {$ref: '#/components/responses/SuccessResponse'}}
  /api/logistics/{orderId}:
    get:
      operationId: getLogisticsTrace
      parameters: [{$ref: '#/components/parameters/OrderId'}]
      responses: {'200': {$ref: '#/components/responses/SuccessResponse'}}
  /api/logistics/order/{orderId}/trace:
    get:
      operationId: listLogisticsTrace
      parameters: [{$ref: '#/components/parameters/OrderId'}]
      responses: {'200': {$ref: '#/components/responses/SuccessResponse'}}
  /api/logistics/trace:
    post:
      operationId: appendLogisticsTrace
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      responses: {'200': {$ref: '#/components/responses/SuccessResponse'}}
  /api/logistics/push-next:
    post:
      operationId: pushNextLogisticsTrace
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      responses: {'200': {$ref: '#/components/responses/SuccessResponse'}}
  /api/admin/orders/list:
    get:
      operationId: listAdminOrders
      parameters: [{$ref: '#/components/parameters/PageNum'}, {$ref: '#/components/parameters/PageSize'}]
      responses: {'200': {$ref: '#/components/responses/OrderPageResponse'}, '403': {$ref: '#/components/responses/ErrorResponse'}}
  /api/admin/orders:
    get:
      operationId: listAdminOrdersAlias
      parameters: [{$ref: '#/components/parameters/PageNum'}, {$ref: '#/components/parameters/PageSize'}]
      responses: {'200': {$ref: '#/components/responses/OrderPageResponse'}, '403': {$ref: '#/components/responses/ErrorResponse'}}
  /api/admin/orders/detail/{orderId}:
    get:
      operationId: getAdminOrder
      parameters: [{$ref: '#/components/parameters/OrderId'}]
      responses: {'200': {$ref: '#/components/responses/OrderResponse'}, '403': {$ref: '#/components/responses/ErrorResponse'}}
  /api/admin/orders/{orderId}:
    get:
      operationId: getAdminOrderAlias
      parameters: [{$ref: '#/components/parameters/OrderId'}]
      responses: {'200': {$ref: '#/components/responses/OrderResponse'}, '403': {$ref: '#/components/responses/ErrorResponse'}}
  /api/admin/orders/{orderId}/after-sale-logs:
    get:
      operationId: listAfterSaleLogs
      parameters: [{$ref: '#/components/parameters/OrderId'}]
      responses: {'200': {$ref: '#/components/responses/SuccessResponse'}}
  /api/admin/orders/batch-close:
    post:
      operationId: batchCloseOrders
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      responses: {'200': {$ref: '#/components/responses/SuccessResponse'}}
  /api/admin/orders/{orderId}/refund/approve:
    post:
      operationId: approveAdminRefund
      parameters: [{$ref: '#/components/parameters/OrderId'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      responses: {'200': {$ref: '#/components/responses/OrderResponse'}}
  /api/admin/orders/{orderId}/refund/reject:
    post:
      operationId: rejectAdminRefund
      parameters: [{$ref: '#/components/parameters/OrderId'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      responses: {'200': {$ref: '#/components/responses/OrderResponse'}}
  /internal/orders/secondhand:
    post:
      operationId: createSecondhandOrder
      security: [{internalToken: []}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/SecondhandOrderRequest'}}}
      responses: {'200': {description: Raw internal order snapshot, content: {application/json: {schema: {$ref: '#/components/schemas/InternalOrder'}}}}}
  /internal/orders/by-business-key/{key}:
    get:
      operationId: getOrderByBusinessKey
      security: [{internalToken: []}]
      parameters: [{$ref: '#/components/parameters/BusinessKey'}]
      responses: {'200': {description: Raw internal order snapshot, content: {application/json: {schema: {$ref: '#/components/schemas/InternalOrder'}}}}}
  /internal/orders/{orderId}/snapshot:
    get:
      operationId: getInternalOrderSnapshot
      security: [{internalToken: []}]
      parameters: [{$ref: '#/components/parameters/OrderId'}]
      responses: {'200': {description: Minimum internal snapshot}}
components:
  securitySchemes:
    bearerAuth: {type: http, scheme: bearer, bearerFormat: JWT}
    internalToken: {type: apiKey, in: header, name: X-Internal-Service-Token}
  parameters:
    OrderId: {name: orderId, in: path, required: true, schema: {type: integer, format: int64}}
    ReviewId: {name: reviewId, in: path, required: true, schema: {type: integer, format: int64}}
    BusinessKey: {name: key, in: path, required: true, schema: {type: string}}
    IdempotencyKey: {name: Idempotency-Key, in: header, required: true, schema: {type: string, maxLength: 160}}
    PageNum: {name: pageNum, in: query, schema: {type: integer, minimum: 1, default: 1}}
    PageSize: {name: pageSize, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 10}}
  responses:
    SuccessResponse:
      description: Successful response
      content: {application/json: {schema: {$ref: '#/components/schemas/SuccessEnvelope'}}}
    OrderResponse:
      description: Successful order response
      content: {application/json: {schema: {$ref: '#/components/schemas/OrderEnvelope'}}}
    OrderPageResponse:
      description: Successful paged order response
      content: {application/json: {schema: {$ref: '#/components/schemas/OrderPageEnvelope'}}}
    ErrorResponse:
      description: Stable business error
      content: {application/json: {schema: {$ref: '#/components/schemas/ErrorEnvelope'}}}
  schemas:
    SuccessEnvelope:
      type: object
      required: [code, message]
      properties: {code: {type: integer, enum: [0]}, message: {type: string}, data: {nullable: true}}
    ErrorEnvelope:
      type: object
      required: [code, message]
      properties: {code: {type: string}, message: {type: string}, data: {nullable: true}}
    OrderEnvelope:
      type: object
      required: [code, message, data]
      properties: {code: {type: integer, enum: [0]}, message: {type: string}, data: {$ref: '#/components/schemas/PublicOrder'}}
    OrderPageEnvelope:
      type: object
      required: [code, message, data]
      properties:
        code: {type: integer, enum: [0]}
        message: {type: string}
        data:
          type: object
          required: [total, pageNum, pageSize, records]
          properties:
            total: {type: integer, format: int64}
            pageNum: {type: integer, format: int64}
            pageSize: {type: integer, format: int64}
            records: {type: array, items: {$ref: '#/components/schemas/PublicOrder'}}
    PublicOrder:
      type: object
      required: [id, orderNo, payStatus, orderStatus, orderStatusKey, refundStatus, items]
      properties:
        id: {type: integer, format: int64}
        orderNo: {type: string}
        payStatus: {type: integer, enum: [0, 1]}
        orderStatus: {type: integer, enum: [0, 1, 2, 3, 4, 9]}
        orderStatusKey: {type: string}
        refundStatus: {type: integer, enum: [0, 1, 2, 3]}
        payableAmount: {type: number}
        productType: {type: string}
        items: {type: array, items: {type: object}}
    InternalOrder:
      type: object
      required: [id, orderNo, orderStatus, items]
      properties: {id: {type: integer, format: int64}, orderNo: {type: string}, orderStatus: {type: string}, items: {type: array, items: {type: object}}}
    CreateOrderRequest:
      type: object
      required: [items, receiverName, receiverPhone, receiverProvince, receiverCity, receiverDetailAddress]
      properties:
        items: {type: array, minItems: 1, items: {$ref: '#/components/schemas/CreateOrderItem'}}
        receiverName: {type: string}
        receiverPhone: {type: string}
        receiverProvince: {type: string}
        receiverCity: {type: string}
        receiverDetailAddress: {type: string}
        voucherId: {type: integer, format: int64, nullable: true}
        remark: {type: string, maxLength: 255}
    CreateOrderItem:
      type: object
      required: [productId, quantity]
      properties: {productId: {type: integer, format: int64}, quantity: {type: integer, minimum: 1}}
    SecondhandOrderRequest:
      type: object
      required: [tradeType, tradeId, buyerUserId, sellerUserId, productId, productName, price, receiverName, receiverPhone, receiverProvince, receiverCity, receiverDetailAddress]
      properties:
        tradeType: {type: string}
        tradeId: {type: string}
        buyerUserId: {type: integer, format: int64}
        sellerUserId: {type: integer, format: int64}
        productId: {type: integer, format: int64}
        productName: {type: string}
        price: {type: number}
