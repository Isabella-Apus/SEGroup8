<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">secondhand-service 服务边界图</title>
  <desc id="desc">网关、身份、目录、订单和消息服务与二手服务及 secondhand_db 的关系。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#3b82f6"/></marker>
    <style>.box{fill:#fff;stroke:#9cc7ee;stroke-width:2;rx:8}.core{fill:#effcf8;stroke:#37c6a0;stroke-width:3;rx:12}.db{fill:#fff7dc;stroke:#e8b84a;stroke-width:2}.t{font:600 18px Arial,sans-serif;fill:#123142}.s{font:14px Arial,sans-serif;fill:#496575}.line{stroke:#3b82f6;stroke-width:2;fill:none;marker-end:url(#arrow)}</style>
  </defs>
  <rect width="1200" height="620" fill="#f7fbff"/>
  <text x="600" y="42" text-anchor="middle" class="t" font-size="25">MS-04 secondhand-service</text>
  <rect x="330" y="90" width="540" height="400" class="core"/>
  <text x="600" y="125" text-anchor="middle" class="t">UC16-UC19 强一致边界</text>
  <rect x="385" y="160" width="180" height="80" class="box"/><text x="475" y="194" text-anchor="middle" class="t">二手商品</text><text x="475" y="220" text-anchor="middle" class="s">发布 / 风险状态</text>
  <rect x="635" y="160" width="180" height="80" class="box"/><text x="725" y="194" text-anchor="middle" class="t">议价</text><text x="725" y="220" text-anchor="middle" class="s">申请 / 确认 / 拒绝</text>
  <rect x="385" y="285" width="180" height="80" class="box"/><text x="475" y="319" text-anchor="middle" class="t">拍卖</text><text x="475" y="345" text-anchor="middle" class="s">CAS 出价 / 赢家</text>
  <rect x="635" y="285" width="180" height="80" class="box"/><text x="725" y="319" text-anchor="middle" class="t">成交请求</text><text x="725" y="345" text-anchor="middle" class="s">tradeType + tradeId</text>
  <rect x="510" y="400" width="180" height="60" class="db"/><text x="600" y="437" text-anchor="middle" class="t">secondhand_db</text>
  <rect x="25" y="125" width="220" height="70" class="box"/><text x="135" y="168" text-anchor="middle" class="t">API Gateway</text>
  <rect x="25" y="260" width="220" height="70" class="box"/><text x="135" y="290" text-anchor="middle" class="t">identity-governance</text><text x="135" y="313" text-anchor="middle" class="s">JWT</text>
  <rect x="955" y="95" width="220" height="80" class="box"/><text x="1065" y="128" text-anchor="middle" class="t">order-service</text><text x="1065" y="151" text-anchor="middle" class="s">订单 / UC20</text>
  <rect x="955" y="250" width="220" height="80" class="box"/><text x="1065" y="282" text-anchor="middle" class="t">catalog-shop</text><text x="1065" y="307" text-anchor="middle" class="s">分类投影 / 风险</text>
  <rect x="955" y="405" width="220" height="80" class="box"/><text x="1065" y="438" text-anchor="middle" class="t">messaging-service</text><text x="1065" y="463" text-anchor="middle" class="s">事件通知</text>
  <path d="M245 160 H330" class="line"/><path d="M245 295 H330" class="line"/>
  <path d="M870 200 C920 200 920 135 955 135" class="line"/><path d="M870 275 H955" class="line"/><path d="M870 390 C920 390 920 445 955 445" class="line"/>
  <path d="M565 200 H635" class="line"/><path d="M565 325 H635" class="line"/><path d="M725 365 V400" class="line"/>
  <text x="600" y="555" text-anchor="middle" class="s">订单仅通过内部 API 与事件协作，禁止跨库写 order_info</text>
</svg>
