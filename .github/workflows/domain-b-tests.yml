name: Domain B tests

on:
  pull_request:
    paths:
      - "microservices/**"
      - "frontend/**"
      - "compose.yml"
      - "docker/mysql/**"
      - "01_requirements/UC0[6-9]-*"
      - "01_requirements/UC10-*"
      - "02_docs/domains/B-catalog-shop/**"
      - "03_devops/domains/domain-b.md"
      - "04_tests/UC0[6-9]/**"
      - "04_tests/UC10/**"
      - "04_tests/domains/B-catalog-shop/**"
      - ".github/workflows/domain-b-tests.yml"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  api-integration:
    name: Domain B API integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Run tagged Spring Boot and H2 integration tests
        run: mvn -B --no-transfer-progress -f microservices/pom.xml -Pdomain-b clean test
      - name: Upload all Domain B Surefire reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: domain-b-surefire-reports
          path: microservices/*/target/surefire-reports/**
          if-no-files-found: error
          retention-days: 14

  browser-e2e:
    name: Domain B browser E2E
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies and Chromium
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Build the real frontend
        working-directory: frontend
        run: npm run build:real
      - name: Start frontend, backend, and MySQL
        run: docker compose up --build --wait --wait-timeout 180
      - name: Run real browser flows
        working-directory: frontend
        env:
          E2E_BASE_URL: http://127.0.0.1:8088
        run: npm run e2e:domain-b
      - name: Upload Playwright raw results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: domain-b-playwright-reports
          path: |
            frontend/test-results/**
            frontend/playwright-report/**
          if-no-files-found: error
          retention-days: 14
      - name: Stop Compose stack
        if: always()
        run: docker compose down --volumes
