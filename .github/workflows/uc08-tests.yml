name: UC08 tests

on:
  pull_request:
    paths:
      - 'microservices/shop-service/**'
      - 'microservices/pom.xml'
      - '01_requirements/UC08-*'
      - '02_docs/UC08-*'
      - '04_tests/UC08/**'
      - '.github/workflows/uc08-tests.yml'
  push:
    branches: ['codex/uc08-results']

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Run UC08 tests
        run: mvn -B -f microservices/shop-service/pom.xml clean test
      - name: Upload raw reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uc08-surefire-reports
          path: microservices/shop-service/target/surefire-reports/
