name: CI/CD Pipeline

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pipeline-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Build production frontend
        run: npm run build:real
      - name: Upload frontend artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          if-no-files-found: error
          retention-days: 7

  backend:
    name: Backend tests and package
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Run tests and package JAR
        run: mvn -B --no-transfer-progress clean verify
      - name: Prepare deployable JAR
        run: cp target/platform-backend-*.jar target/app.jar
      - name: Upload backend artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: backend/target/app.jar
          if-no-files-found: error
          retention-days: 7
      - name: Upload backend test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-surefire-reports
          path: backend/target/surefire-reports/**
          if-no-files-found: ignore
          retention-days: 7

  microservices:
    name: Microservices tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: microservices
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Run unit, API and end-to-end tests
        run: mvn -B --no-transfer-progress clean verify
      - name: Validate Kubernetes manifests
        run: kubectl kustomize k8s > /dev/null
      - name: Upload microservices test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: microservices-surefire-reports
          path: microservices/*/target/surefire-reports/**
          if-no-files-found: ignore
          retention-days: 7

  container-images:
    name: Publish ${{ matrix.service }} image
    if: >-
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: [frontend, backend, microservices]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service:
          - catalog-service
          - shop-service
          - risk-service
          - behavior-service
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.service }}
          tags: |
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: microservices
          file: microservices/${{ matrix.service }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  deploy-kubernetes:
    name: Deploy microservices to Kubernetes
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      vars.ENABLE_K8S_DEPLOY == 'true'
    needs: [container-images]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: kubernetes-production
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Configure cluster access
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
        run: |
          mkdir -p "$RUNNER_TEMP/kube"
          printf '%s' "$KUBE_CONFIG" | base64 --decode > "$RUNNER_TEMP/kube/config"
          chmod 600 "$RUNNER_TEMP/kube/config"
          echo "KUBECONFIG=$RUNNER_TEMP/kube/config" >> "$GITHUB_ENV"
      - name: Apply manifests and immutable image versions
        env:
          IMAGE_OWNER: ${{ github.repository_owner }}
        run: |
          owner="$(printf '%s' "$IMAGE_OWNER" | tr '[:upper:]' '[:lower:]')"
          kubectl apply -k microservices/k8s
          kubectl -n se-group8 set image deployment/catalog-service catalog="ghcr.io/$owner/catalog-service:sha-$GITHUB_SHA"
          kubectl -n se-group8 set image deployment/shop-service shop="ghcr.io/$owner/shop-service:sha-$GITHUB_SHA"
          kubectl -n se-group8 set image deployment/risk-service risk="ghcr.io/$owner/risk-service:sha-$GITHUB_SHA"
          kubectl -n se-group8 set image deployment/behavior-service behavior="ghcr.io/$owner/behavior-service:sha-$GITHUB_SHA"
      - name: Wait for rollouts
        run: |
          kubectl -n se-group8 rollout status deployment/catalog-service --timeout=180s
          kubectl -n se-group8 rollout status deployment/shop-service --timeout=180s
          kubectl -n se-group8 rollout status deployment/risk-service --timeout=180s
          kubectl -n se-group8 rollout status deployment/behavior-service --timeout=180s

  deploy-production:
    name: Deploy frontend and backend to production
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      vars.ENABLE_PRODUCTION_DEPLOY == 'true'
    needs: [frontend, backend, microservices]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - name: Check out deployment script
        uses: actions/checkout@v4
      - name: Download frontend artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: release/frontend
      - name: Download backend artifact
        uses: actions/download-artifact@v4
        with:
          name: backend-jar
          path: release/backend
      - name: Package release bundle
        run: tar -czf "release-$GITHUB_SHA.tar.gz" -C release .
      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -d -m 700 "$HOME/.ssh"
          printf '%s' "$DEPLOY_SSH_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
      - name: Upload and activate release
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/srv/SE/SEGroup8' }}
          BACKEND_SERVICE: ${{ vars.BACKEND_SERVICE || 'segroup8-backend' }}
          NGINX_SERVICE: ${{ vars.NGINX_SERVICE || 'nginx' }}
        run: |
          remote_archive="/tmp/segroup8-$GITHUB_SHA.tar.gz"
          scp "release-$GITHUB_SHA.tar.gz" "$DEPLOY_USER@$DEPLOY_HOST:$remote_archive"
          ssh "$DEPLOY_USER@$DEPLOY_HOST" \
            "bash -s -- '$GITHUB_SHA' '$DEPLOY_PATH' '$BACKEND_SERVICE' '$NGINX_SERVICE'" \
            < .github/scripts/deploy-production.sh

  release:
    name: Create GitHub release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [frontend, backend, container-images]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download frontend artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: release/frontend
      - name: Download backend artifact
        uses: actions/download-artifact@v4
        with:
          name: backend-jar
          path: release/backend
      - name: Package release bundle
        run: tar -czf "segroup8-${GITHUB_REF_NAME}.tar.gz" -C release .
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$GITHUB_REF_NAME" "segroup8-${GITHUB_REF_NAME}.tar.gz" --generate-notes
