name: Kinda Goods CI/CD

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pipeline-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  # Level 1: shared frontend and backend platform gates.
  frontend:
    name: 1 / Frontend common tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Build production frontend
        run: npm run build:real
      - name: Upload frontend artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          if-no-files-found: error
          retention-days: 7

  backend-platform:
    name: 1 / Backend platform tests and JAR
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Java and Maven cache
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: |
            backend/pom.xml
            microservices/pom.xml
            microservices/*/pom.xml
      - name: Run shared JWT security contract tests
        run: mvn -B --no-transfer-progress -f ../microservices/pom.xml -pl security-contract -am test
      - name: Run public backend tests and package JAR
        run: >-
          mvn -B --no-transfer-progress clean verify
          "-DexcludedGroups=DOMAIN_A,DOMAIN_C,DOMAIN_D,DOMAIN_E"
      - name: Prepare deployable JAR
        run: cp target/platform-backend-*.jar target/app.jar
      - name: Upload backend JAR
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: backend/target/app.jar
          if-no-files-found: error
          retention-days: 7
      - name: Upload platform test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-platform-surefire-reports
          path: |
            backend/target/surefire-reports/**
            microservices/security-contract/target/surefire-reports/**
          if-no-files-found: warn
          retention-days: 14

  # Level 2: every domain uses the same reusable workflow and Maven cache.
  domain-a:
    name: 2 / Domain A (UC01-UC05)
    needs: [frontend, backend-platform]
    uses: ./.github/workflows/_domain-tests.yml
    with:
      domain: A

  domain-b:
    name: 2 / Domain B (UC06-UC10)
    needs: [frontend, backend-platform]
    uses: ./.github/workflows/_domain-tests.yml
    with:
      domain: B

  domain-c:
    name: 2 / Domain C (UC11-UC15)
    needs: [frontend, backend-platform]
    uses: ./.github/workflows/_domain-tests.yml
    with:
      domain: C

  domain-d:
    name: 2 / Domain D (UC16-UC20)
    needs: [frontend, backend-platform]
    uses: ./.github/workflows/_domain-tests.yml
    with:
      domain: D

  domain-e:
    name: 2 / Domain E (UC21-UC25)
    needs: [frontend, backend-platform]
    uses: ./.github/workflows/_domain-tests.yml
    with:
      domain: E

  # Level 3: prove the tested artifacts boot together before the full UC run.
  playwright:
    name: 3 / Playwright full-stack smoke
    needs: [domain-a, domain-b, domain-c, domain-d, domain-e]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CI: "true"
      E2E_USERNAME: user
      E2E_PASSWORD: user123
      E2E_ROLE: USER
      E2E_ADMIN_USERNAME: admin
      E2E_ADMIN_PASSWORD: admin123
      E2E_OFFICIAL_SELLER_USERNAME: seller
      E2E_OFFICIAL_SELLER_PASSWORD: seller123
      E2E_BUYER_USERNAME: user
      E2E_BUYER_PASSWORD: user123
      E2E_THIRD_PARTY_USERNAME: third
      E2E_THIRD_PARTY_PASSWORD: third123
      COMPOSE_FILE: compose.yml:compose.e2e.yml
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Download tested backend JAR
        uses: actions/download-artifact@v4
        with:
          name: backend-jar
          path: backend/target
      - name: Download built frontend
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Start MySQL, backend JAR, and frontend; run Playwright smoke
        run: |
          chmod +x scripts/e2e/run-compose-e2e.sh
          scripts/e2e/run-compose-e2e.sh e2e/smoke --workers=1
      - name: Upload Playwright smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-smoke-evidence
          path: 04_tests/platform-e2e/evidence/**
          if-no-files-found: warn
          retention-days: 14

  # Level 4: a fresh full stack runs every checked-in UC E2E suite.
  all-e2e-tests:
    name: 4 / All UC E2E tests
    needs: [playwright]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CI: "true"
      E2E_USERNAME: user
      E2E_PASSWORD: user123
      E2E_ROLE: USER
      E2E_ADMIN_USERNAME: admin
      E2E_ADMIN_PASSWORD: admin123
      E2E_OFFICIAL_SELLER_USERNAME: seller
      E2E_OFFICIAL_SELLER_PASSWORD: seller123
      E2E_BUYER_USERNAME: user
      E2E_BUYER_PASSWORD: user123
      E2E_THIRD_PARTY_USERNAME: third
      E2E_THIRD_PARTY_PASSWORD: third123
      COMPOSE_FILE: compose.yml:compose.e2e.yml
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Download tested backend JAR
        uses: actions/download-artifact@v4
        with:
          name: backend-jar
          path: backend/target
      - name: Download built frontend
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Start full stack and run all Domain A-E E2E suites
        run: |
          chmod +x scripts/e2e/run-compose-e2e.sh
          scripts/e2e/run-compose-e2e.sh \
            e2e/domain-a \
            e2e/domain-b \
            e2e/domain-c \
            e2e/domain-d \
            e2e/domain-e \
            --workers=1
      - name: Upload all UC E2E evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: all-uc-e2e-evidence
          path: 04_tests/platform-e2e/evidence/**
          if-no-files-found: warn
          retention-days: 14

  # Level 5: release and deployment can only follow the complete E2E gate.
  deploy-production:
    name: 5 / Deploy production
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      vars.ENABLE_PRODUCTION_DEPLOY == 'true'
    needs: [all-e2e-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - name: Check out deployment script
        uses: actions/checkout@v4
      - name: Download frontend artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: release/frontend
      - name: Download backend artifact
        uses: actions/download-artifact@v4
        with:
          name: backend-jar
          path: release/backend
      - name: Package release bundle
        run: tar -czf "release-$GITHUB_SHA.tar.gz" -C release .
      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -d -m 700 "$HOME/.ssh"
          printf '%s' "$DEPLOY_SSH_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
      - name: Upload and activate release
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/srv/SE/SEGroup8' }}
          BACKEND_SERVICE: ${{ vars.BACKEND_SERVICE || 'segroup8-backend' }}
          NGINX_SERVICE: ${{ vars.NGINX_SERVICE || 'nginx' }}
        run: |
          remote_archive="/tmp/segroup8-$GITHUB_SHA.tar.gz"
          scp "release-$GITHUB_SHA.tar.gz" "$DEPLOY_USER@$DEPLOY_HOST:$remote_archive"
          ssh "$DEPLOY_USER@$DEPLOY_HOST" \
            "bash -s -- '$GITHUB_SHA' '$DEPLOY_PATH' '$BACKEND_SERVICE' '$NGINX_SERVICE'" \
            < .github/scripts/deploy-production.sh

  release:
    name: 5 / Create GitHub release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [all-e2e-tests]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download frontend artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: release/frontend
      - name: Download backend artifact
        uses: actions/download-artifact@v4
        with:
          name: backend-jar
          path: release/backend
      - name: Package release bundle
        run: tar -czf "segroup8-${GITHUB_REF_NAME}.tar.gz" -C release .
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$GITHUB_REF_NAME" "segroup8-${GITHUB_REF_NAME}.tar.gz" --generate-notes
