name: Kinda Goods CI/CD

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pipeline-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Build production frontend
        run: npm run build:real
      - name: Upload frontend artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          if-no-files-found: error
          retention-days: 7

  backend:
    name: Backend automated tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Run Domain A tagged tests
        run: mvn -B --no-transfer-progress -Dgroups=DOMAIN_A test
      - name: Upload Domain A test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: domain-a-surefire-reports
          path: backend/target/surefire-reports/**
          if-no-files-found: ignore
          retention-days: 14
      - name: Run shared JWT security contract tests
        run: mvn -B --no-transfer-progress -f ../microservices/pom.xml -pl security-contract -am test
      - name: Upload shared JWT contract reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: platform-security-contract-surefire-reports
          path: microservices/security-contract/target/surefire-reports/**
          if-no-files-found: ignore
          retention-days: 14
      - name: Run tests and package JAR
        run: mvn -B --no-transfer-progress clean verify
      - name: Prepare deployable JAR
        run: cp target/platform-backend-*.jar target/app.jar
      - name: Upload backend artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: backend/target/app.jar
          if-no-files-found: error
          retention-days: 7
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-surefire-reports
          path: backend/target/surefire-reports/**
          if-no-files-found: ignore
          retention-days: 7

  domain-e:
    name: DOMAIN_E tagged tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Run Domain-E tagged tests
        run: mvn -B --no-transfer-progress -Dgroups=DOMAIN_E test
      - name: Upload Domain-E Surefire reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: domain-e-surefire-reports
          path: backend/target/surefire-reports/**
          if-no-files-found: error
          retention-days: 14

  e2e:
    name: Real full-stack Playwright E2E
    needs: [frontend, backend, domain-e]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CI: "true"
      E2E_USERNAME: user
      E2E_PASSWORD: user123
      E2E_ROLE: USER
      E2E_ADMIN_USERNAME: admin
      E2E_ADMIN_PASSWORD: admin123
      E2E_OFFICIAL_SELLER_USERNAME: seller
      E2E_OFFICIAL_SELLER_PASSWORD: seller123
      E2E_BUYER_USERNAME: user
      E2E_BUYER_PASSWORD: user123
      E2E_THIRD_PARTY_USERNAME: third
      E2E_THIRD_PARTY_PASSWORD: third123
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Download tested backend JAR
        uses: actions/download-artifact@v4
        with:
          name: backend-jar
          path: backend/target
      - name: Download built frontend
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Run real Compose and Playwright smoke
        env:
          COMPOSE_FILE: compose.yml:compose.e2e.yml
        run: |
          chmod +x scripts/e2e/run-compose-e2e.sh
          scripts/e2e/run-compose-e2e.sh
      - name: Upload full-stack E2E evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: platform-e2e-evidence
          path: 04_tests/platform-e2e/evidence/**
          if-no-files-found: warn
          retention-days: 14

  delivery-config:
    name: Validate Helm delivery configuration
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Helm
        uses: azure/setup-helm@v4
      - name: Lint and render the production chart
        run: |
          helm lint deploy/helm/segroup8 \
            --set-string backend.image.repository=registry.example/segroup8/backend \
            --set-string backend.image.tag=sha-test \
            --set-string frontend.image.repository=registry.example/segroup8/frontend \
            --set-string frontend.image.tag=sha-test \
            --set-file mysql.initSchema=backend/src/main/resources/schema.sql
          helm template segroup8 deploy/helm/segroup8 \
            --namespace segroup8 \
            --set-string backend.image.repository=registry.example/segroup8/backend \
            --set-string backend.image.tag=sha-test \
            --set-string frontend.image.repository=registry.example/segroup8/frontend \
            --set-string frontend.image.tag=sha-test \
            --set-file mysql.initSchema=backend/src/main/resources/schema.sql \
            >/dev/null

  publish-images:
    name: Publish verified images to ACR
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      vars.ENABLE_PRODUCTION_DEPLOY == 'true'
    needs: [frontend, backend, e2e, delivery-config]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Download tested backend JAR
        uses: actions/download-artifact@v4
        with:
          name: backend-jar
          path: backend/target
      - name: Download built frontend
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
      - name: Validate ACR configuration
        env:
          ACR_REGISTRY: ${{ vars.ACR_REGISTRY }}
          ACR_NAMESPACE: ${{ vars.ACR_NAMESPACE }}
          ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
          ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
        run: |
          test -n "$ACR_REGISTRY"
          test -n "$ACR_NAMESPACE"
          test -n "$ACR_USERNAME"
          test -n "$ACR_PASSWORD"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to Alibaba Cloud ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.ACR_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}
      - name: Build and push verified backend image
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/Dockerfile.runtime
          push: true
          tags: |
            ${{ vars.ACR_REGISTRY }}/${{ vars.ACR_NAMESPACE }}/backend:sha-${{ github.sha }}
            ${{ vars.ACR_REGISTRY }}/${{ vars.ACR_NAMESPACE }}/backend:latest
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
      - name: Build and push verified frontend image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          file: frontend/Dockerfile.runtime
          push: true
          tags: |
            ${{ vars.ACR_REGISTRY }}/${{ vars.ACR_NAMESPACE }}/frontend:sha-${{ github.sha }}
            ${{ vars.ACR_REGISTRY }}/${{ vars.ACR_NAMESPACE }}/frontend:latest
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

  deploy-production:
    name: Deploy images to production K3s
    needs: publish-images
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - name: Check out deployment configuration
        uses: actions/checkout@v4
      - name: Package Helm chart and database schema
        run: |
          tar -czf "k3s-release-$GITHUB_SHA.tar.gz" \
            deploy/helm/segroup8 \
            backend/src/main/resources/schema.sql
      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
      - name: Upload and deploy release
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          ACR_REGISTRY: ${{ vars.ACR_REGISTRY }}
          ACR_NAMESPACE: ${{ vars.ACR_NAMESPACE }}
          K8S_NAMESPACE: ${{ vars.K8S_NAMESPACE || 'segroup8' }}
        run: |
          remote_archive="/tmp/segroup8-k3s-$GITHUB_SHA.tar.gz"
          scp "k3s-release-$GITHUB_SHA.tar.gz" "$DEPLOY_USER@$DEPLOY_HOST:$remote_archive"
          ssh "$DEPLOY_USER@$DEPLOY_HOST" \
            "bash -s -- '$GITHUB_SHA' '$remote_archive' '$ACR_REGISTRY' '$ACR_NAMESPACE' 'sha-$GITHUB_SHA' '$K8S_NAMESPACE'" \
            < .github/scripts/deploy-k3s.sh
      - name: Verify public production endpoint
        if: vars.PRODUCTION_URL != ''
        env:
          PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
        run: |
          curl --fail --silent --show-error \
            --retry 12 --retry-all-errors --retry-delay 5 \
            "${PRODUCTION_URL%/}/health" >/dev/null

  release:
    name: Create GitHub release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [frontend, backend, e2e]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download frontend artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: release/frontend
      - name: Download backend artifact
        uses: actions/download-artifact@v4
        with:
          name: backend-jar
          path: release/backend
      - name: Package release bundle
        run: tar -czf "segroup8-${GITHUB_REF_NAME}.tar.gz" -C release .
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$GITHUB_REF_NAME" "segroup8-${GITHUB_REF_NAME}.tar.gz" --generate-notes
