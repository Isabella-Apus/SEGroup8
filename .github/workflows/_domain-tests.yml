name: Reusable domain tests

on:
  workflow_call:
    inputs:
      domain:
        description: Domain letter (A-E)
        required: true
        type: string

permissions:
  contents: read

jobs:
  tests:
    name: Domain ${{ inputs.domain }} tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DOMAIN: ${{ inputs.domain }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Validate domain input
        shell: bash
        run: |
          case "$DOMAIN" in
            A|B|C|D|E) ;;
            *) echo "Unsupported domain: $DOMAIN" >&2; exit 2 ;;
          esac
      - name: Set up Java and shared Maven cache
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: |
            backend/pom.xml
            microservices/pom.xml
            microservices/*/pom.xml
      - name: Set up Node.js for Domain C evidence
        if: inputs.domain == 'C'
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Run Domain A (UC01-UC05) backend tests
        if: inputs.domain == 'A'
        run: >-
          mvn -B --no-transfer-progress -f backend/pom.xml
          "-Dgroups=DOMAIN_A" clean test
      - name: Run Domain B (UC06-UC10) microservice tests
        if: inputs.domain == 'B'
        run: mvn -B --no-transfer-progress -f microservices/pom.xml -Pdomain-b clean test
      - name: Require Domain B MySQL integration test to execute
        if: inputs.domain == 'B'
        shell: bash
        run: |
          report=microservices/catalog-shop-service/target/surefire-reports/TEST-com.segroup8.catalogshop.MySqlSchemaOwnershipIntegrationTest.xml
          test -f "$report"
          python - "$report" <<'PY'
          import sys, xml.etree.ElementTree as ET
          suite = ET.parse(sys.argv[1]).getroot()
          if int(suite.attrib.get("tests", "0")) < 1 or int(suite.attrib.get("skipped", "0")) != 0:
              raise SystemExit("required MySQL integration test was skipped")
          PY
      - name: Upload tested catalog-shop JAR for full-system E2E
        if: inputs.domain == 'B'
        uses: actions/upload-artifact@v4
        with:
          name: catalog-shop-e2e-jar
          path: microservices/catalog-shop-service/target/catalog-shop-service-1.0.0.jar
          if-no-files-found: error
          retention-days: 3
      - name: Run Domain C (UC11-UC15) tests and collect evidence
        if: inputs.domain == 'C'
        run: node 04_tests/domains/C-order-fulfillment/run-domain-c-tests.mjs --suite DOMAIN_C --goal verify
      - name: Verify Domain C evidence
        if: inputs.domain == 'C'
        run: node 04_tests/domains/C-order-fulfillment/verify-evidence.mjs --suite=DOMAIN_C
      - name: Run Domain D (UC16-UC20) backend tests
        if: inputs.domain == 'D'
        run: >-
          mvn -B --no-transfer-progress -f backend/pom.xml
          "-Dgroups=DOMAIN_D" clean test
      - name: Run Domain E (UC21-UC25) backend tests
        if: inputs.domain == 'E'
        run: >-
          mvn -B --no-transfer-progress -f backend/pom.xml
          "-Dgroups=DOMAIN_E" clean test
      - name: Generate Domain ${{ inputs.domain }} structured test summary
        if: always()
        shell: pwsh
        run: |
          $reportsRoot = if ($env:DOMAIN -eq "B") {
            "microservices"
          } else {
            "backend/target/surefire-reports"
          }
          $outputDirectory = ".ci/test-summaries/domain-$($env:DOMAIN.ToLowerInvariant())"
          ./scripts/test/summarize-domain-surefire.ps1 `
            -Domain $env:DOMAIN `
            -ReportsRoot $reportsRoot `
            -OutputDirectory $outputDirectory
      - name: Upload backend domain reports
        if: always() && inputs.domain != 'B' && inputs.domain != 'C'
        uses: actions/upload-artifact@v4
        with:
          name: domain-${{ inputs.domain }}-test-evidence
          path: |
            backend/target/surefire-reports/**
            .ci/test-summaries/**
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
      - name: Upload Domain B reports
        if: always() && inputs.domain == 'B'
        uses: actions/upload-artifact@v4
        with:
          name: domain-${{ inputs.domain }}-test-evidence
          path: |
            microservices/*/target/surefire-reports/**
            .ci/test-summaries/**
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
      - name: Upload Domain C reports and evidence
        if: always() && inputs.domain == 'C'
        uses: actions/upload-artifact@v4
        with:
          name: domain-${{ inputs.domain }}-test-evidence
          path: |
            backend/target/surefire-reports/**
            04_tests/domains/C-order-fulfillment/evidence/logs/backend-domain-c.log
            04_tests/domains/C-order-fulfillment/evidence/raw-reports/surefire/**
            04_tests/domains/C-order-fulfillment/evidence/result-summary.json
            .ci/test-summaries/**
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
