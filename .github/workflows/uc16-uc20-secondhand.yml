name: UC16-UC20 secondhand
on:
  pull_request:
    paths:
      - "backend/**"
      - "02_docs/**"
      - "04_tests/**"
      - "05_management/**"
      - ".github/workflows/uc16-uc20-secondhand.yml"
  push:
    branches: [main]
    paths:
      - "backend/**"
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: UC16-UC20 backend tests
        run: mvn -B "-Dtest=SecondhandProductServiceImplTest,SecondhandTradeServiceImplTest,SecondhandOrderFlowIntegrationTest,SecondhandAuctionIntegrationTest" test
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uc16-uc20-surefire-reports
          path: backend/target/surefire-reports/**
