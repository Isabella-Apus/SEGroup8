name: Order Service CI/CD

on:
  pull_request:
    paths:
      - "microservices/order-service/**"
      - "microservices/security-contract/**"
      - "microservices/pom.xml"
      - "frontend/e2e/domain-c/**"
      - "frontend/e2e/domain-d/uc20-fulfillment.spec.ts"
      - "frontend/e2e/microservices/order-service-api.spec.ts"
      - "frontend/playwright.config.ts"
      - "frontend/src/**"
      - "frontend/vite.config.js"
      - "frontend/docker/nginx.conf"
      - "compose*.yml"
      - "scripts/e2e/stubs/order-downstream-contract-stub.mjs"
      - "02_docs/microservices/order-service/**"
      - "03_devops/microservices/order-service/**"
      - "04_tests/microservices/order-service/**"
      - "05_management/microservices/order-service/**"
      - "deploy/helm/segroup8/templates/order-*.yaml"
      - "deploy/helm/segroup8/templates/ingress.yaml"
      - "deploy/helm/segroup8/values.yaml"
      - ".github/scripts/deploy-order-k3s.sh"
      - ".github/scripts/sync-acr-pull-secret.sh"
      - ".github/scripts/collect-order-k3s-diagnostics.sh"
      - ".github/workflows/order-service-ci-cd.yml"
  push:
    branches: [main]
    paths:
      - "microservices/order-service/**"
      - "microservices/security-contract/**"
      - "microservices/pom.xml"
      - "frontend/e2e/domain-c/**"
      - "frontend/e2e/domain-d/uc20-fulfillment.spec.ts"
      - "frontend/e2e/microservices/order-service-api.spec.ts"
      - "frontend/playwright.config.ts"
      - "frontend/src/**"
      - "frontend/vite.config.js"
      - "frontend/docker/nginx.conf"
      - "compose*.yml"
      - "scripts/e2e/stubs/order-downstream-contract-stub.mjs"
      - "02_docs/microservices/order-service/**"
      - "03_devops/microservices/order-service/**"
      - "04_tests/microservices/order-service/**"
      - "05_management/microservices/order-service/**"
      - "deploy/helm/segroup8/templates/order-*.yaml"
      - "deploy/helm/segroup8/templates/ingress.yaml"
      - "deploy/helm/segroup8/values.yaml"
      - ".github/scripts/deploy-order-k3s.sh"
      - ".github/scripts/sync-acr-pull-secret.sh"
      - ".github/scripts/collect-order-k3s-diagnostics.sh"
      - ".github/workflows/order-service-ci-cd.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: order-service-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  order-verify:
    name: order-service API, integration and contract tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: microservices/**/pom.xml
      - name: Reject forbidden cross-domain persistence
        shell: bash
        run: |
          if grep -R -n -E 'ProductMapper|BalanceMapper|VoucherMapper|NotificationMapper|INSERT[[:space:]]+INTO[[:space:]]+(product|balance|voucher|notification)' microservices/order-service/src/main/java; then
            echo "order-service contains forbidden cross-domain persistence"
            exit 1
          fi
      - name: Run clean verification with real MySQL integration test
        run: mvn -B --no-transfer-progress -f microservices/pom.xml -pl order-service -am clean verify
      - name: Reject skipped order-service tests
        shell: bash
        run: |
          if grep -R -E 'tests="[0-9]+"[^>]*skipped="[1-9][0-9]*"|skipped="[1-9][0-9]*"[^>]*tests="[0-9]+"' microservices/order-service/target/surefire-reports/TEST-*.xml; then
            echo "order-service verification skipped at least one required test"
            exit 1
          fi
      - name: Build candidate image from the tested JAR
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p release-candidate
          mapfile -t jars < <(find microservices/order-service/target -maxdepth 1 -type f -name 'order-service-*.jar' ! -name '*.original' -print)
          test "${#jars[@]}" -eq 1
          jar_sha="$(sha256sum "${jars[0]}" | cut -d ' ' -f 1)"
          candidate="segroup8/order:candidate-${GITHUB_SHA}"
          docker build \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --label "com.segroup8.order.jar-sha256=${jar_sha}" \
            -t "$candidate" \
            microservices/order-service
          test "$(docker image inspect "$candidate" --format '{{.Config.User}}')" = "10001:10001"
          test "$(docker image inspect "$candidate" --format '{{index .Config.Labels "com.segroup8.order.jar-sha256"}}')" = "$jar_sha"
          image_id="$(docker image inspect "$candidate" --format '{{.Id}}')"
          printf '%s  %s\n' "$jar_sha" "$(basename "${jars[0]}")" > release-candidate/order-service-jar.sha256
          jq -n \
            --arg gitSha "$GITHUB_SHA" \
            --arg jarSha256 "$jar_sha" \
            --arg candidateImage "$candidate" \
            --arg candidateImageId "$image_id" \
            '{gitSha:$gitSha,jarSha256:$jarSha256,candidateImage:$candidateImage,candidateImageId:$candidateImageId}' \
            > release-candidate/release-metadata.json
          docker image save "$candidate" | gzip -1 > release-candidate/order-service-image.tar.gz
      - name: Upload tested Boot JAR
        uses: actions/upload-artifact@v4
        with:
          name: order-service-jar
          path: |
            microservices/order-service/target/order-service-*.jar
            release-candidate/order-service-jar.sha256
          if-no-files-found: error
          retention-days: 7
      - name: Upload tested candidate image and trace metadata
        uses: actions/upload-artifact@v4
        with:
          name: order-service-candidate-${{ github.sha }}
          path: release-candidate/**
          if-no-files-found: error
          retention-days: 7
      - name: Upload service test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: order-service-test-reports
          path: |
            microservices/order-service/target/surefire-reports/**
            microservices/order-service/target/failsafe-reports/**
          if-no-files-found: warn
          retention-days: 14

  order-service-e2e:
    name: UC11-UC15 and UC20 candidate image API E2E
    needs: order-verify
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: "true"
      E2E_BASE_URL: http://127.0.0.1:18081
      COMPOSE_PROJECT_NAME: segroup8-order-service-e2e
      ORDER_ACCEPTANCE_IMAGE: segroup8/order:candidate-${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Download the tested candidate image
        uses: actions/download-artifact@v4
        with:
          name: order-service-candidate-${{ github.sha }}
          path: release-candidate
      - name: Load and verify the exact candidate image
        shell: bash
        run: |
          set -Eeuo pipefail
          docker image load --input release-candidate/order-service-image.tar.gz
          test "$(jq -r '.gitSha' release-candidate/release-metadata.json)" = "$GITHUB_SHA"
          test "$(docker image inspect "$ORDER_ACCEPTANCE_IMAGE" --format '{{.Id}}')" = "$(jq -r '.candidateImageId' release-candidate/release-metadata.json)"
          test "$(docker image inspect "$ORDER_ACCEPTANCE_IMAGE" --format '{{index .Config.Labels "com.segroup8.order.jar-sha256"}}')" = "$(jq -r '.jarSha256' release-candidate/release-metadata.json)"
          cp release-candidate/release-metadata.json "$RUNNER_TEMP/order-service-candidate-metadata.json"
      - name: Install Playwright test runner
        working-directory: frontend
        run: npm ci
      - name: Start downstream contract stub and order-service stack
        run: |
          ORDER_STUB_HOST=0.0.0.0 node scripts/e2e/stubs/order-downstream-contract-stub.mjs >"$RUNNER_TEMP/order-downstream-stub.log" 2>&1 &
          echo $! >"$RUNNER_TEMP/order-downstream-stub.pid"
          stub_ready=false
          for _ in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:18086/health | grep -q '"status":"UP"'; then
              stub_ready=true
              break
            fi
            sleep 1
          done
          if test "$stub_ready" != true; then
            cat "$RUNNER_TEMP/order-downstream-stub.log"
            exit 1
          fi
          docker compose -f microservices/order-service/compose.acceptance.yml up -d --no-build
          for _ in $(seq 1 90); do
            if curl --fail --silent http://127.0.0.1:18081/actuator/health/readiness | grep -q '"status":"UP"'; then exit 0; fi
            sleep 2
          done
          docker compose -f microservices/order-service/compose.acceptance.yml ps
          docker compose -f microservices/order-service/compose.acceptance.yml logs --no-color
          exit 1
      - name: Run UC11-UC15 and UC20 through the exact candidate image
        working-directory: frontend
        env:
          E2E_OUTPUT_DIR: ${{ runner.temp }}/order-service-e2e
        run: npx playwright test e2e/microservices/order-service-api.spec.ts --workers=1
      - name: Collect independent service diagnostics
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/order-service-e2e/logs"
          docker compose -f microservices/order-service/compose.acceptance.yml ps --all >"$RUNNER_TEMP/order-service-e2e/logs/compose-ps.txt" 2>&1 || true
          docker compose -f microservices/order-service/compose.acceptance.yml logs --no-color --timestamps >"$RUNNER_TEMP/order-service-e2e/logs/compose.log" 2>&1 || true
          cp "$RUNNER_TEMP/order-downstream-stub.log" "$RUNNER_TEMP/order-service-e2e/logs/order-downstream-stub.log" || true
          cp "$RUNNER_TEMP/order-service-candidate-metadata.json" "$RUNNER_TEMP/order-service-e2e/release-metadata.json" || true
          curl --silent --show-error http://127.0.0.1:18081/v3/api-docs >"$RUNNER_TEMP/order-service-e2e/runtime-openapi.json" || true
      - name: Stop independent service stack
        if: always()
        run: |
          docker compose -f microservices/order-service/compose.acceptance.yml down -v --remove-orphans || true
          if test -f "$RUNNER_TEMP/order-downstream-stub.pid"; then kill "$(cat "$RUNNER_TEMP/order-downstream-stub.pid")" || true; fi
      - name: Upload independent service E2E evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: order-service-api-e2e-${{ github.sha }}
          path: ${{ runner.temp }}/order-service-e2e/**
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  order-domain-e2e:
    name: UC11-UC15 and UC20 Compose Playwright regression
    needs: order-verify
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CI: "true"
      COMPOSE_FILE: compose.yml:compose.e2e.yml
      COMPOSE_PROJECT_NAME: segroup8-order-e2e
      E2E_USERNAME: user
      E2E_PASSWORD: user123
      E2E_ROLE: USER
      E2E_ADMIN_USERNAME: admin
      E2E_ADMIN_PASSWORD: admin123
      E2E_OFFICIAL_SELLER_USERNAME: seller
      E2E_OFFICIAL_SELLER_PASSWORD: seller123
      E2E_BUYER_USERNAME: user
      E2E_BUYER_PASSWORD: user123
      E2E_THIRD_PARTY_USERNAME: third
      E2E_THIRD_PARTY_PASSWORD: third123
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: "17", cache: maven, cache-dependency-path: backend/pom.xml}
      - uses: actions/setup-node@v4
        with: {node-version: "20", cache: npm, cache-dependency-path: frontend/package-lock.json}
      - name: Build runtime artifacts for Compose
        run: |
          mvn -B --no-transfer-progress -f backend/pom.xml -DskipTests package
          cp backend/target/platform-backend-*.jar backend/target/app.jar
          cd frontend
          npm ci
          npm run build:real
      - name: Run full-stack smoke and order use cases
        env:
          E2E_EVIDENCE_ROOT: ${{ runner.temp }}/order-domain-evidence
          E2E_OUTPUT_DIR: ${{ runner.temp }}/order-domain-evidence/playwright
        run: |
          chmod +x scripts/e2e/run-compose-e2e.sh
          scripts/e2e/run-compose-e2e.sh --smoke-first e2e/smoke -- e2e/domain-c e2e/domain-d/uc20-fulfillment.spec.ts --workers=1
      - name: Upload browser, Compose and service logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: order-service-e2e-evidence
          path: ${{ runner.temp }}/order-domain-evidence/**
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14

  delivery-config:
    name: Lint order-service Helm delivery
    needs: order-verify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: Lint and render order-service
        run: |
          helm lint deploy/helm/segroup8 --set order.enabled=true --set-string order.image.repository=registry.example/segroup8/order --set-string order.image.tag=sha-test --set-string backend.image.repository=registry.example/segroup8/backend --set-string backend.image.tag=sha-test --set-string frontend.image.repository=registry.example/segroup8/frontend --set-string frontend.image.tag=sha-test --set-file mysql.initSchema=backend/src/main/resources/schema.sql
          render="$(mktemp)"
          helm template segroup8 deploy/helm/segroup8 --namespace segroup8 --show-only templates/order-deployment.yaml --set order.enabled=true --set-string order.image.repository=registry.example/segroup8/order --set-string order.image.tag=sha-test --set-string backend.image.repository=registry.example/segroup8/backend --set-string backend.image.tag=sha-test --set-string frontend.image.repository=registry.example/segroup8/frontend --set-string frontend.image.tag=sha-test --set-file mysql.initSchema=backend/src/main/resources/schema.sql >"$render"
          grep -q 'runAsUser: 10001' "$render"
          grep -q 'runAsGroup: 10001' "$render"
          grep -q 'readOnlyRootFilesystem: true' "$render"
          grep -q 'mountPath: /tmp' "$render"

  publish-order-image:
    name: Publish immutable order-service image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [order-verify, order-service-e2e, order-domain-e2e, delivery-config]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Download the E2E-tested candidate image
        uses: actions/download-artifact@v4
        with:
          name: order-service-candidate-${{ github.sha }}
          path: release-candidate
      - name: Validate shared ACR configuration
        env:
          ACR_REGISTRY: ${{ vars.ACR_REGISTRY }}
          ACR_NAMESPACE: ${{ vars.ACR_NAMESPACE }}
          ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
          ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
        run: |
          test -n "$ACR_REGISTRY"
          test -n "$ACR_NAMESPACE"
          test -n "$ACR_USERNAME"
          test -n "$ACR_PASSWORD"
      - uses: docker/login-action@v3
        with:
          registry: ${{ vars.ACR_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}
      - name: Push the exact candidate image without rebuilding
        shell: bash
        env:
          ACR_REGISTRY: ${{ vars.ACR_REGISTRY }}
          ACR_NAMESPACE: ${{ vars.ACR_NAMESPACE }}
        run: |
          set -Eeuo pipefail
          candidate="segroup8/order:candidate-${GITHUB_SHA}"
          target="${ACR_REGISTRY}/${ACR_NAMESPACE}/order:sha-${GITHUB_SHA}"
          docker image load --input release-candidate/order-service-image.tar.gz
          test "$(docker image inspect "$candidate" --format '{{.Id}}')" = "$(jq -r '.candidateImageId' release-candidate/release-metadata.json)"
          test "$(docker image inspect "$candidate" --format '{{index .Config.Labels "com.segroup8.order.jar-sha256"}}')" = "$(jq -r '.jarSha256' release-candidate/release-metadata.json)"
          docker image tag "$candidate" "$target"
          docker image push "$target" | tee order-image-push.log
          repo_digest="$(docker image inspect "$target" --format '{{join .RepoDigests "\n"}}' | head -n 1)"
          test -n "$repo_digest"
          printf '%s\n' "$repo_digest" > order-image-digest.txt
          jq \
            --arg publishedImage "$target" \
            --arg repositoryDigest "$repo_digest" \
            '. + {publishedImage:$publishedImage,repositoryDigest:$repositoryDigest}' \
            release-candidate/release-metadata.json > order-release-metadata.json
      - uses: actions/upload-artifact@v4
        with:
          name: order-image-digest-${{ github.sha }}
          path: |
            order-image-digest.txt
            order-image-push.log
            order-release-metadata.json
          if-no-files-found: error
          retention-days: 30

  deploy-order:
    name: Helm atomic deploy order-service
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.ENABLE_PRODUCTION_DEPLOY == 'true'
    needs: publish-order-image
    runs-on: ubuntu-latest
    timeout-minutes: 70
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Package Helm chart
        run: tar -czf "order-chart-$GITHUB_SHA.tar.gz" deploy/helm/segroup8
      - name: Configure SSH
        env: {DEPLOY_SSH_KEY: "${{ secrets.DEPLOY_SSH_KEY }}", DEPLOY_KNOWN_HOSTS: "${{ secrets.DEPLOY_KNOWN_HOSTS }}"}
        run: |
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
      - name: Upload chart and deploy atomically
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          ACR_REGISTRY: ${{ vars.ACR_REGISTRY }}
          ACR_NAMESPACE: ${{ vars.ACR_NAMESPACE }}
          ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
          ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
          K8S_NAMESPACE: ${{ vars.K8S_NAMESPACE || 'segroup8' }}
        run: |
          set -o pipefail
          .github/scripts/sync-acr-pull-secret.sh
          archive="/tmp/order-chart-$GITHUB_SHA.tar.gz"
          scp "order-chart-$GITHUB_SHA.tar.gz" "$DEPLOY_USER@$DEPLOY_HOST:$archive"
          ssh -o ServerAliveInterval=30 -o ServerAliveCountMax=10 "$DEPLOY_USER@$DEPLOY_HOST" "bash -s -- '$GITHUB_SHA' '$archive' '$ACR_REGISTRY' '$ACR_NAMESPACE' 'sha-$GITHUB_SHA' '$K8S_NAMESPACE'" < .github/scripts/deploy-order-k3s.sh | tee order-deployment.log
      - name: Collect downloadable Kubernetes diagnostics
        if: always()
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          K8S_NAMESPACE: ${{ vars.K8S_NAMESPACE || 'segroup8' }}
        run: |
          if test -f "$HOME/.ssh/id_ed25519"; then
            ssh -o ServerAliveInterval=30 -o ServerAliveCountMax=3 \
              "$DEPLOY_USER@$DEPLOY_HOST" \
              "bash -s -- '$K8S_NAMESPACE' 'segroup8'" \
              < .github/scripts/collect-order-k3s-diagnostics.sh \
              > order-deployment-diagnostics.tar.gz \
              2> order-diagnostics-collection.log || true
          else
            printf '%s\n' 'SSH configuration was unavailable; remote diagnostics could not be collected.' \
              > order-diagnostics-collection.log
          fi
      - name: Upload deployment and rollback diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: order-deployment-${{ github.sha }}
          path: |
            order-deployment.log
            order-deployment-diagnostics.tar.gz
            order-diagnostics-collection.log
          if-no-files-found: warn
          retention-days: 30
