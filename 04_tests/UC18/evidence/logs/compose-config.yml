name: segroup8-platform
services:
  backend:
    build:
      context: C:\Users\Chazey\Desktop\SEGroup8-main\backend
      dockerfile: Dockerfile.runtime
    depends_on:
      database:
        condition: service_healthy
        required: true
    environment:
      APP_RISK_AUDIT_LLM_ENABLED: "false"
      DB_PASSWORD: segroup8_dev_password
      DB_URL: jdbc:mysql://database:3306/segroup8_platform?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
      DB_USERNAME: segroup8
      JWT_SECRET: SEGROUP8_DOCKER_DEMO_SECRET_CHANGE_ME_2026
      REALTIME_ALLOWED_ORIGIN_PATTERNS: '*'
      SPRING_CONFIG_IMPORT: optional:file:/run/segroup8-compose-local.yml
      SPRING_DATASOURCE_PASSWORD: segroup8_dev_password
      SPRING_DATASOURCE_USERNAME: segroup8
      TZ: Asia/Shanghai
    healthcheck:
      test:
        - CMD-SHELL
        - 'bash -c ''exec 3<>/dev/tcp/127.0.0.1/8080; printf "GET /actuator/health HTTP/1.0\r\nHost: localhost\r\n\r\n" >&3; grep -q "UP" <&3'''
      timeout: 5s
      interval: 10s
      retries: 12
      start_period: 50s
    image: segroup8/backend:1.0.0
    networks:
      platform: null
    ports:
      - mode: ingress
        target: 8080
        published: "8089"
        protocol: tcp
    restart: unless-stopped
  database:
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_general_ci
    environment:
      MYSQL_DATABASE: segroup8_platform
      MYSQL_PASSWORD: segroup8_dev_password
      MYSQL_ROOT_PASSWORD: segroup8_root_password
      MYSQL_USER: segroup8
      TZ: Asia/Shanghai
    healthcheck:
      test:
        - CMD-SHELL
        - mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent
      timeout: 5s
      interval: 5s
      retries: 30
      start_period: 20s
    image: mysql:8.4.6
    networks:
      platform: null
    ports:
      - mode: ingress
        target: 3306
        published: "3307"
        protocol: tcp
    restart: unless-stopped
    volumes:
      - type: volume
        source: mysql_data
        target: /var/lib/mysql
        volume: {}
      - type: bind
        source: C:\Users\Chazey\Desktop\SEGroup8-main\backend\src\main\resources\schema.sql
        target: /docker-entrypoint-initdb.d/01-schema.sql
        read_only: true
        bind: {}
      - type: bind
        source: C:\Users\Chazey\Desktop\SEGroup8-main\docker\mysql\02-seed.sql
        target: /docker-entrypoint-initdb.d/02-seed.sql
        read_only: true
        bind: {}
  frontend:
    build:
      context: C:\Users\Chazey\Desktop\SEGroup8-main\frontend
      dockerfile: Dockerfile.runtime
    depends_on:
      backend:
        condition: service_healthy
        required: true
    healthcheck:
      test:
        - CMD
        - wget
        - -q
        - -O
        - /dev/null
        - http://127.0.0.1/health
      timeout: 3s
      interval: 10s
      retries: 6
      start_period: 10s
    image: segroup8/frontend:1.0.0
    networks:
      platform: null
    ports:
      - mode: ingress
        target: 80
        published: "8088"
        protocol: tcp
    restart: unless-stopped
networks:
  platform:
    name: segroup8-platform
volumes:
  mysql_data:
    name: segroup8-platform-mysql-data
