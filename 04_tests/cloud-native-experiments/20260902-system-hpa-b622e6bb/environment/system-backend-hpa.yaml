apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: segroup8-backend
  namespace: segroup8
  annotations:
    meta.helm.sh/release-name: segroup8
    meta.helm.sh/release-namespace: segroup8
  labels:
    app.kubernetes.io/managed-by: Helm
    experiment.segroup8/scope: complete-system
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: segroup8-backend
  minReplicas: 2
  maxReplicas: 4
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      selectPolicy: Max
      policies:
        - type: Pods
          value: 2
          periodSeconds: 15
    scaleDown:
      stabilizationWindowSeconds: 60
      selectPolicy: Max
      policies:
        - type: Percent
          value: 50
          periodSeconds: 15
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
