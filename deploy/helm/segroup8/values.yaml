imagePullSecrets:
  - name: acr-pull-secret

backend:
  replicaCount: 1
  image:
    repository: ""
    tag: ""
    pullPolicy: IfNotPresent
  secretName: segroup8-backend-secret
  uploads:
    storageClassName: local-path
    size: 5Gi
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1536Mi

frontend:
  replicaCount: 1
  image:
    repository: ""
    tag: ""
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 256Mi

secondhand:
  enabled: false
  replicaCount: 1
  image:
    repository: ""
    tag: ""
    pullPolicy: IfNotPresent
  secretName: segroup8-secondhand-secret
  service:
    port: 8080
  deployment:
    version: ""
    commit: ""
    buildTime: ""
  orderServiceUrl: http://segroup8-order:8085
  catalogShopServiceUrl: http://catalog-shop-service:8080
  orderConnectTimeout: 1s
  orderReadTimeout: 2s
  orderMaxAttempts: 3
  tradeRecoveryDelayMs: 5000
  tradeRecoveryBatchSize: 20
  auctionSettlementDelayMs: 5000
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 768Mi
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 4
    targetCPUUtilizationPercentage: 70
    behavior:
      scaleUp:
        stabilizationWindowSeconds: 0
        pods: 2
        periodSeconds: 15
      scaleDown:
        stabilizationWindowSeconds: 60
        percent: 50
        periodSeconds: 15

identityGovernance:
  # The component is enabled by its own service pipeline after the shared
  # segroup8 release exists. This keeps platform-only releases installable.
  enabled: false
  replicaCount: 1
  image:
    repository: ""
    tag: ""
    pullPolicy: IfNotPresent
  secretName: identity-governance-secret
  service:
    port: 8091
  deployment:
    version: ""
    commit: ""
    buildTime: ""
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 768Mi
  # The HPA manifest is delivered for the later course experiment but remains
  # disabled until the team runs and records the autoscaling experiment.
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 4
    targetCPUUtilizationPercentage: 70

order:
  enabled: false
  replicaCount: 1
  deployment:
    version: ""
    commit: ""
    buildTime: ""
  image:
    repository: ""
    tag: ""
    pullPolicy: IfNotPresent
  secretName: segroup8-order-secret
  service:
    port: 8085
  downstream:
    catalogUrl: http://catalog-shop-service:8080
    financeUrl: http://benefits-finance-service:8080
    messagingUrl: http://messaging-service:8080
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 768Mi

mysql:
  image:
    repository: mysql
    tag: 8.4.6
    pullPolicy: IfNotPresent
  secretName: segroup8-mysql-secret
  storage:
    storageClassName: local-path
    size: 10Gi
  # Supplied by deploy-k3s.sh with Helm --set-file. Production deliberately
  # does not load docker/mysql/02-seed.sql because it contains demo accounts.
  initSchema: ""
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1536Mi

ingress:
  enabled: true
  className: traefik
  # Leave empty for an IP-based first deployment. Set a DNS name before TLS.
  host: ""

deployment:
  version: ""
  commit: ""
  buildTime: ""
