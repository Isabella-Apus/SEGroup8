imagePullSecrets:
  - name: acr-pull-secret

backend:
  replicaCount: 1
  image:
    repository: ""
    tag: ""
    pullPolicy: IfNotPresent
  secretName: segroup8-backend-secret
  uploads:
    storageClassName: local-path
    size: 5Gi
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1536Mi

frontend:
  replicaCount: 1
  image:
    repository: ""
    tag: ""
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 256Mi

identityGovernance:
  # The component is enabled by its own service pipeline after the shared
  # segroup8 release exists. This keeps platform-only releases installable.
  enabled: false
  replicaCount: 1
  image:
    repository: ""
    tag: ""
    pullPolicy: IfNotPresent
  secretName: identity-governance-secret
  service:
    port: 8091
  deployment:
    version: ""
    commit: ""
    buildTime: ""
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 768Mi
  # The HPA manifest is delivered for the later course experiment but remains
  # disabled until the team runs and records the autoscaling experiment.
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 4
    targetCPUUtilizationPercentage: 70

mysql:
  image:
    repository: mysql
    tag: 8.4.6
    pullPolicy: IfNotPresent
  secretName: segroup8-mysql-secret
  storage:
    storageClassName: local-path
    size: 10Gi
  # Supplied by deploy-k3s.sh with Helm --set-file. Production deliberately
  # does not load docker/mysql/02-seed.sql because it contains demo accounts.
  initSchema: ""
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1536Mi

ingress:
  enabled: true
  className: traefik
  # Leave empty for an IP-based first deployment. Set a DNS name before TLS.
  host: ""

deployment:
  version: ""
  commit: ""
  buildTime: ""
