imagePullSecrets:
  - name: acr-pull-secret

backend:
  replicaCount: 1
  image:
    repository: ""
    tag: ""
    pullPolicy: IfNotPresent
  secretName: segroup8-backend-secret
  uploads:
    storageClassName: local-path
    size: 5Gi
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1536Mi

messaging:
  # The messaging service is delivered by its own pipeline. Keep the shared
  # platform release installable without a messaging image or secret.
  enabled: false
  replicaCount: 1
  image:
    repository: ""
    # CI supplies an immutable sha-<git-sha> tag; no latest fallback is allowed.
    tag: ""
    pullPolicy: IfNotPresent
  secretName: segroup8-messaging-secret
  deployment:
    version: ""
    commit: ""
    buildTime: ""
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 768Mi
  config:
    identityServiceUrl: http://identity-governance-service:8091
    realtimeAllowedOriginPatterns: ""
    identityConnectTimeoutMs: "2000"
    identityReadTimeoutMs: "3000"
    identityMaxAttempts: "3"
    identityRetryBackoffMs: "100"
    inboxPollDelayMs: "1000"
    inboxMaxRetries: "5"
    deliveryPollDelayMs: "1000"
    deliveryMaxRetries: "5"

frontend:
  replicaCount: 1
  image:
    repository: ""
    tag: ""
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 256Mi

identityGovernance:
  # The component is enabled by its own service pipeline after the shared
  # segroup8 release exists. This keeps platform-only releases installable.
  enabled: false
  replicaCount: 1
  image:
    repository: ""
    tag: ""
    pullPolicy: IfNotPresent
  secretName: identity-governance-secret
  service:
    port: 8091
  deployment:
    version: ""
    commit: ""
    buildTime: ""
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 768Mi
  # The HPA manifest is delivered for the later course experiment but remains
  # disabled until the team runs and records the autoscaling experiment.
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 4
    targetCPUUtilizationPercentage: 70

order:
  enabled: false
  replicaCount: 1
  deployment:
    version: ""
    commit: ""
    buildTime: ""
  image:
    repository: ""
    tag: ""
    pullPolicy: IfNotPresent
  secretName: segroup8-order-secret
  service:
    port: 8085
  downstream:
    catalogUrl: http://segroup8-catalog-shop:8080
    financeUrl: http://benefits-finance:8085
    messagingUrl: http://messaging:8084
    secondhandUrl: http://secondhand-service:8080
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 768Mi

secondhand:
  enabled: false
  replicaCount: 1
  image:
    repository: ""
    tag: ""
    pullPolicy: IfNotPresent
  secretName: segroup8-secondhand-secret
  service:
    port: 8080
  deployment:
    version: ""
    commit: ""
    buildTime: ""
  orderServiceUrl: http://segroup8-order:8085
  identityServiceUrl: http://identity-governance-service:8091
  messagingServiceUrl: http://messaging:8084
  catalogShopServiceUrl: http://segroup8-catalog-shop:8080
  orderConnectTimeout: 1s
  orderReadTimeout: 2s
  orderMaxAttempts: 3
  tradeRecoveryDelayMs: 5000
  tradeRecoveryBatchSize: 20
  auctionSettlementDelayMs: 5000
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 768Mi
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 4
    targetCPUUtilizationPercentage: 70
    behavior:
      scaleUp:
        stabilizationWindowSeconds: 0
        pods: 2
        periodSeconds: 15
      scaleDown:
        stabilizationWindowSeconds: 60
        percent: 50
        periodSeconds: 15

mysql:
  image:
    repository: mysql
    tag: 8.4.6
    pullPolicy: IfNotPresent
  secretName: segroup8-mysql-secret
  storage:
    storageClassName: local-path
    size: 10Gi
  # Supplied by deploy-k3s.sh with Helm --set-file. Production deliberately
  # does not load docker/mysql/02-seed.sql because it contains demo accounts.
  initSchema: ""
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1536Mi

ingress:
  enabled: true
  className: traefik
  # Leave empty for an IP-based first deployment. Set a DNS name before TLS.
  host: ""

deployment:
  version: ""
  commit: ""
  buildTime: ""

catalogShop:
  # Enabled explicitly by the catalog-shop release workflow so the existing
  # monolith release is not changed before its database Secret is provisioned.
  enabled: false
  replicaCount: 1
  image:
    repository: ""
    tag: ""
    pullPolicy: IfNotPresent
  secretName: segroup8-catalog-shop-secret
  identityStatusCheckUrl: http://identity-governance-service:8091/internal/auth/introspect
  messagingEventUrl: http://messaging:8084
  orderEventUrl: http://segroup8-order:8085
  deployment:
    version: ""
    commit: ""
    buildTime: ""
  resources:
    requests: {cpu: 200m, memory: 256Mi}
    limits: {cpu: "1", memory: 768Mi}
  hpa:
    enabled: false
    minReplicas: 2
    maxReplicas: 8
    targetCPUUtilizationPercentage: 65

benefitsFinance:
  enabled: false
  replicas: 1
  image:
    repository: segroup8/benefits-finance
    tag: dev
    commit: unknown
    buildTime: unknown
    pullPolicy: IfNotPresent
  service:
    port: 8085
  secretName: benefits-finance-secrets
  config:
    currency: CNY
    orderServiceUrl: http://segroup8-order:8085
    quoteTtlSeconds: "300"
    reservationTtlSeconds: "900"
    outboxEventSinkUrl: http://messaging:8084/internal/events
    outboxPollMs: "5000"
    outboxBatchSize: "50"
    outboxMaxAttempts: "8"
    httpConnectTimeoutMs: "1000"
    httpReadTimeoutMs: "3000"
    javaToolOptions: "-Djava.io.tmpdir=/tmp"
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { cpu: 500m, memory: 512Mi }
