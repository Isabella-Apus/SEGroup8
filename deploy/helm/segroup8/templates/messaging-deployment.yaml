apiVersion: apps/v1
kind: Deployment
metadata:
  name: messaging
  labels:
    {{- include "segroup8.labels" . | nindent 4 }}
    app.kubernetes.io/component: messaging
spec:
  replicas: {{ .Values.messaging.replicaCount }}
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      {{- include "segroup8.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: messaging
  template:
    metadata:
      labels:
        {{- include "segroup8.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: messaging
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      imagePullSecrets:
        {{- toYaml .Values.imagePullSecrets | nindent 8 }}
      containers:
        - name: messaging
          image: "{{ required "messaging.image.repository is required" .Values.messaging.image.repository }}:{{ required "messaging.image.tag is required" .Values.messaging.image.tag }}"
          imagePullPolicy: {{ .Values.messaging.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8084
          envFrom:
            - secretRef:
                name: {{ .Values.messaging.secretName }}
            - configMapRef:
                name: segroup8-messaging-config
          env:
            - name: APP_VERSION
              value: {{ .Values.deployment.version | quote }}
            - name: APP_COMMIT
              value: {{ .Values.deployment.commit | quote }}
            - name: APP_BUILD_TIME
              value: {{ .Values.deployment.buildTime | quote }}
            - name: SERVER_PORT
              value: "8084"
            - name: TZ
              value: Asia/Shanghai
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 24
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            {{- toYaml .Values.messaging.resources | nindent 12 }}
