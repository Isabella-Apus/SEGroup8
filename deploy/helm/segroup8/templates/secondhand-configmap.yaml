{{- if .Values.secondhand.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: segroup8-secondhand-config
  labels:
    {{- include "segroup8.labels" . | nindent 4 }}
    app.kubernetes.io/component: secondhand-service
data:
  ORDER_SERVICE_URL: {{ .Values.secondhand.orderServiceUrl | quote }}
  IDENTITY_SERVICE_URL: {{ .Values.secondhand.identityServiceUrl | quote }}
  CATALOG_SHOP_SERVICE_URL: {{ .Values.secondhand.catalogShopServiceUrl | quote }}
  ORDER_CONNECT_TIMEOUT: {{ .Values.secondhand.orderConnectTimeout | quote }}
  ORDER_READ_TIMEOUT: {{ .Values.secondhand.orderReadTimeout | quote }}
  ORDER_MAX_ATTEMPTS: {{ .Values.secondhand.orderMaxAttempts | quote }}
  TRADE_RECOVERY_DELAY_MS: {{ .Values.secondhand.tradeRecoveryDelayMs | quote }}
  TRADE_RECOVERY_BATCH_SIZE: {{ .Values.secondhand.tradeRecoveryBatchSize | quote }}
  AUCTION_SETTLEMENT_DELAY_MS: {{ .Values.secondhand.auctionSettlementDelayMs | quote }}
{{- end }}
