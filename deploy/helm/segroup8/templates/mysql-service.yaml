apiVersion: v1
kind: Service
metadata:
  name: mysql
  labels:
    {{- include "segroup8.labels" . | nindent 4 }}
    app.kubernetes.io/component: database
spec:
  clusterIP: None
  selector:
    {{- include "segroup8.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: database
  ports:
    - name: mysql
      port: 3306
      targetPort: mysql
