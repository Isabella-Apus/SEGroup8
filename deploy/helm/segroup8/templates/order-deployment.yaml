{{- if .Values.order.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-order
  labels:
    {{- include "segroup8.labels" . | nindent 4 }}
    app.kubernetes.io/component: order-service
spec:
  replicas: {{ .Values.order.replicaCount }}
  selector:
    matchLabels:
      {{- include "segroup8.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: order-service
  template:
    metadata:
      labels:
        {{- include "segroup8.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: order-service
      annotations:
        checksum/order-config: {{ include (print $.Template.BasePath "/order-configmap.yaml") . | sha256sum }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: order-service
          image: "{{ required "order.image.repository is required when order.enabled=true" .Values.order.image.repository }}:{{ required "order.image.tag is required when order.enabled=true" .Values.order.image.tag }}"
          imagePullPolicy: {{ .Values.order.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8085
          envFrom:
            - configMapRef:
                name: {{ .Release.Name }}-order
            - secretRef:
                name: {{ .Values.order.secretName }}
          env:
            - name: APP_VERSION
              value: {{ .Values.order.deployment.version | quote }}
            - name: APP_COMMIT
              value: {{ .Values.order.deployment.commit | quote }}
            - name: APP_BUILD_TIME
              value: {{ .Values.order.deployment.buildTime | quote }}
          readinessProbe:
            httpGet: {path: /actuator/health/readiness, port: http}
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet: {path: /actuator/health/liveness, port: http}
            initialDelaySeconds: 30
            periodSeconds: 15
            failureThreshold: 3
          startupProbe:
            httpGet: {path: /actuator/health/liveness, port: http}
            periodSeconds: 5
            failureThreshold: 30
          resources: {{- toYaml .Values.order.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities: {drop: ["ALL"]}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: tmp
          emptyDir: {}
{{- end }}
