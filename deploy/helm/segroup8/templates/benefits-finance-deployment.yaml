{{- if .Values.benefitsFinance.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: benefits-finance
  labels:
    app.kubernetes.io/name: benefits-finance
    app.kubernetes.io/component: finance
spec:
  replicas: {{ .Values.benefitsFinance.replicas }}
  revisionHistoryLimit: 10
  minReadySeconds: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels: { app.kubernetes.io/name: benefits-finance }
  template:
    metadata:
      labels: { app.kubernetes.io/name: benefits-finance }
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/benefits-finance-configmap.yaml") . | sha256sum }}
    spec:
      terminationGracePeriodSeconds: 35
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: benefits-finance
          image: "{{ .Values.benefitsFinance.image.repository }}:{{ .Values.benefitsFinance.image.tag }}"
          imagePullPolicy: {{ .Values.benefitsFinance.image.pullPolicy }}
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: {{ .Values.benefitsFinance.service.port }}
              protocol: TCP
          envFrom:
            - configMapRef: { name: benefits-finance-config }
            - secretRef: { name: {{ .Values.benefitsFinance.secretName }} }
          startupProbe:
            httpGet: { path: /actuator/health/liveness, port: http }
            periodSeconds: 2
            timeoutSeconds: 2
            failureThreshold: 45
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: http }
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: http }
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 5"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          resources:
{{ toYaml .Values.benefitsFinance.resources | indent 12 }}
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
{{- end }}
