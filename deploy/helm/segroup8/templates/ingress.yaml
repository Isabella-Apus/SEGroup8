{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: segroup8
  labels:
    {{- include "segroup8.labels" . | nindent 4 }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - {{- if .Values.ingress.host }}
      host: {{ .Values.ingress.host | quote }}
      {{- end }}
      http:
        paths:
          {{ if .Values.order.enabled }}
          - path: /api/order
            pathType: Prefix
            backend:
              service:
                name: {{ .Release.Name }}-order
                port:
                  name: http
          - path: /api/review
            pathType: Prefix
            backend:
              service:
                name: {{ .Release.Name }}-order
                port:
                  name: http
          - path: /api/logistics
            pathType: Prefix
            backend:
              service:
                name: {{ .Release.Name }}-order
                port:
                  name: http
          - path: /api/admin/orders
            pathType: Prefix
            backend:
              service:
                name: {{ .Release.Name }}-order
                port:
                  name: http
          {{ end }}
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  name: http
{{- end }}
