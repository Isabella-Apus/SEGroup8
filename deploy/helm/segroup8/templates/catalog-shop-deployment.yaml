{{- if .Values.catalogShop.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-catalog-shop
  labels:
    {{- include "segroup8.labels" . | nindent 4 }}
    app.kubernetes.io/component: catalog-shop
spec:
  replicas: {{ .Values.catalogShop.replicaCount }}
  selector:
    matchLabels: {app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: catalog-shop}
  template:
    metadata:
      labels: {app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: catalog-shop}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: catalog-shop
          image: "{{ .Values.catalogShop.image.repository }}:{{ .Values.catalogShop.image.tag }}"
          imagePullPolicy: {{ .Values.catalogShop.image.pullPolicy }}
          ports: [{name: http, containerPort: 8080}]
          env:
            - name: DB_URL
              valueFrom: {secretKeyRef: {name: {{ .Values.catalogShop.secretName }}, key: DB_URL}}
            - name: DB_USERNAME
              valueFrom: {secretKeyRef: {name: {{ .Values.catalogShop.secretName }}, key: DB_USERNAME}}
            - name: DB_PASSWORD
              valueFrom: {secretKeyRef: {name: {{ .Values.catalogShop.secretName }}, key: DB_PASSWORD}}
            - name: INTERNAL_SERVICE_TOKEN
              valueFrom: {secretKeyRef: {name: {{ .Values.catalogShop.secretName }}, key: INTERNAL_SERVICE_TOKEN}}
            - name: JWT_SECRET
              valueFrom: {secretKeyRef: {name: {{ .Values.catalogShop.secretName }}, key: JWT_SECRET}}
            - name: RISK_AUDIT_LLM_API_KEY
              valueFrom: {secretKeyRef: {name: {{ .Values.catalogShop.secretName }}, key: RISK_AUDIT_LLM_API_KEY, optional: true}}
            - {name: IDENTITY_STATUS_CHECK_URL, value: {{ .Values.catalogShop.identityStatusCheckUrl | quote }}}
            - {name: IDENTITY_STATUS_CHECK_MODE, value: "introspect"}
            - {name: MESSAGING_EVENT_URL, value: {{ .Values.catalogShop.messagingEventUrl | quote }}}
            - {name: ORDER_EVENT_URL, value: {{ .Values.catalogShop.orderEventUrl | quote }}}
            - {name: APP_VERSION, value: {{ .Values.deployment.version | quote }}}
            - {name: GIT_COMMIT, value: {{ .Values.deployment.commit | quote }}}
          startupProbe: {httpGet: {path: /actuator/health/liveness, port: http}, failureThreshold: 30, periodSeconds: 5}
          livenessProbe: {httpGet: {path: /actuator/health/liveness, port: http}, periodSeconds: 10, failureThreshold: 3}
          readinessProbe: {httpGet: {path: /actuator/health/readiness, port: http}, periodSeconds: 5, failureThreshold: 3}
          resources: {{- toYaml .Values.catalogShop.resources | nindent 12 }}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, runAsNonRoot: true, capabilities: {drop: [ALL]}}
{{- end }}
