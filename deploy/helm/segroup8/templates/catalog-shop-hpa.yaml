{{- if and .Values.catalogShop.enabled .Values.catalogShop.hpa.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: {name: {{ .Release.Name }}-catalog-shop}
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: {{ .Release.Name }}-catalog-shop}
  minReplicas: {{ .Values.catalogShop.hpa.minReplicas }}
  maxReplicas: {{ .Values.catalogShop.hpa.maxReplicas }}
  behavior:
    scaleDown: {stabilizationWindowSeconds: 300}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: {type: Utilization, averageUtilization: {{ .Values.catalogShop.hpa.targetCPUUtilizationPercentage }}}
{{- end }}
