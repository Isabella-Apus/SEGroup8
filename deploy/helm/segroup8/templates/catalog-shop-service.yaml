{{- if .Values.catalogShop.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-catalog-shop
  labels: {app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: catalog-shop}
spec:
  selector: {app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: catalog-shop}
  ports: [{name: http, port: 8080, targetPort: http}]
{{- end }}
