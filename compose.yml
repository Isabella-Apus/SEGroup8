name: segroup8-platform

services:
  database:
    image: mysql:8.4.6
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: segroup8_platform
      MYSQL_USER: segroup8
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-segroup8_dev_password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-segroup8_root_password}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_general_ci
    ports:
      - "${MYSQL_HOST_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/src/main/resources/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./docker/mysql/02-seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    networks: [platform]

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: segroup8/backend:1.0.0
    restart: unless-stopped
    environment:
      DB_URL: jdbc:mysql://database:3306/segroup8_platform?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
      DB_USERNAME: segroup8
      DB_PASSWORD: ${MYSQL_PASSWORD:-segroup8_dev_password}
      # Explicit Spring properties keep the Compose stack deterministic even
      # when a developer has an ignored application-local.yml in the build JAR.
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:-segroup8}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:-segroup8_dev_password}
      # Do not load a developer's ignored classpath application-local.yml into
      # the container; Compose supplies the database settings above.
      SPRING_CONFIG_IMPORT: optional:file:/run/segroup8-compose-local.yml
      JWT_SECRET: ${JWT_SECRET:-SEGROUP8_DOCKER_DEMO_SECRET_CHANGE_ME_2026}
      APP_RISK_AUDIT_LLM_ENABLED: "false"
      REALTIME_ALLOWED_ORIGIN_PATTERNS: "*"
      TZ: Asia/Shanghai
    ports:
      - "${BACKEND_HOST_PORT:-8089}:8080"
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080; printf \"GET /actuator/health HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n\" >&3; grep -q \"UP\" <&3'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 50s
    networks: [platform]

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: segroup8/frontend:1.0.0
    restart: unless-stopped
    ports:
      - "${FRONTEND_HOST_PORT:-8088}:80"
    # The shared Compose E2E stack still runs the monolith as its only API
    # service. Production images keep the messaging upstream from the image;
    # this mount provides the explicit local/CI compatibility routing so nginx
    # does not resolve a service that this stack does not create.
    volumes:
      - ./frontend/docker/nginx.compose.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/health"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s
    networks: [platform]

networks:
  platform:
    name: segroup8-platform

volumes:
  mysql_data:
    name: segroup8-platform-mysql-data
