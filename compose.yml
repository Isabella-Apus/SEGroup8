name: segroup8-platform

services:
  database:
    image: mysql:8.4.6
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: segroup8_platform
      MYSQL_USER: segroup8
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-segroup8_dev_password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-segroup8_root_password}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_general_ci
    ports:
      - "${MYSQL_HOST_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/src/main/resources/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./docker/mysql/02-seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    networks: [platform]

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: segroup8/backend:1.0.0
    restart: unless-stopped
    environment:
      DB_URL: jdbc:mysql://database:3306/segroup8_platform?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
      DB_USERNAME: segroup8
      DB_PASSWORD: ${MYSQL_PASSWORD:-segroup8_dev_password}
      # Explicit Spring properties keep the Compose stack deterministic even
      # when a developer has an ignored application-local.yml in the build JAR.
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:-segroup8}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:-segroup8_dev_password}
      # Do not load a developer's ignored classpath application-local.yml into
      # the container; Compose supplies the database settings above.
      SPRING_CONFIG_IMPORT: optional:file:/run/segroup8-compose-local.yml
      JWT_SECRET: ${JWT_SECRET:-SEGROUP8_DOCKER_DEMO_SECRET_CHANGE_ME_2026}
      # The shared Compose/E2E stack runs the monolith without messaging-service.
      # Keep this compatibility mode explicit so domain tests persist notifications
      # locally; production deployments leave the event-driven default enabled.
      APP_MESSAGING_EVENT_NOTIFICATIONS_ENABLED: "false"
      APP_RISK_AUDIT_LLM_ENABLED: "false"
      REALTIME_ALLOWED_ORIGIN_PATTERNS: "*"
      TZ: Asia/Shanghai
    ports:
      - "${BACKEND_HOST_PORT:-8089}:8080"
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080; printf \"GET /actuator/health HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n\" >&3; grep -q \"UP\" <&3'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 50s
    networks: [platform]

  catalog-database:
    image: mysql:8.4.6
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: catalog_shop_db
      MYSQL_USER: catalog_shop_app
      MYSQL_PASSWORD: ${CATALOG_MYSQL_PASSWORD:-catalog_shop_dev_password}
      MYSQL_ROOT_PASSWORD: ${CATALOG_MYSQL_ROOT_PASSWORD:-catalog_shop_root_password}
      TZ: Asia/Shanghai
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_general_ci"]
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    volumes:
      - catalog_mysql_data:/var/lib/mysql
    networks: [platform]

  catalog-shop:
    build:
      context: ./microservices/catalog-shop-service
      dockerfile: Dockerfile
    image: segroup8/catalog-shop:1.0.0
    restart: unless-stopped
    environment:
      DB_URL: jdbc:mysql://catalog-database:3306/catalog_shop_db?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
      DB_USERNAME: catalog_shop_app
      DB_PASSWORD: ${CATALOG_MYSQL_PASSWORD:-catalog_shop_dev_password}
      JWT_SECRET: ${JWT_SECRET:-SEGROUP8_DOCKER_DEMO_SECRET_CHANGE_ME_2026}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-segroup8-compose-internal-token}
      IDENTITY_STATUS_CHECK_URL: http://backend:8080/api/user/profile
      IDENTITY_STATUS_CHECK_MODE: profile
      MESSAGING_EVENT_URL: ""
      ORDER_EVENT_URL: ""
      RISK_AUDIT_LLM_API_KEY: ""
      TZ: Asia/Shanghai
    ports:
      - "${CATALOG_SHOP_HOST_PORT:-8086}:8080"
    depends_on:
      catalog-database:
        condition: service_healthy
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/actuator/health/readiness"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 30s
    networks: [platform]

  catalog-seed:
    image: mysql:8.4.6
    restart: "no"
    environment:
      MYSQL_PWD: ${CATALOG_MYSQL_PASSWORD:-catalog_shop_dev_password}
    command: ["sh", "-c", "mysql -h catalog-database -ucatalog_shop_app catalog_shop_db < /seed/catalog-shop.sql"]
    volumes:
      - ./docker/catalog-shop/catalog-shop.sql:/seed/catalog-shop.sql:ro
    depends_on:
      catalog-shop:
        condition: service_healthy
    networks: [platform]

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: segroup8/frontend:1.0.0
    restart: unless-stopped
    ports:
      - "${FRONTEND_HOST_PORT:-8088}:80"
    # The shared Compose E2E stack is the monolith compatibility baseline.
    # Service-specific candidate routing is exercised by each service's own
    # acceptance Compose file; production split routing is owned by Ingress.
    volumes:
      - ./frontend/docker/nginx.compose.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/health"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s
    networks: [platform]

networks:
  platform:
    name: segroup8-platform

volumes:
  mysql_data:
    name: ${PLATFORM_MYSQL_VOLUME_NAME:-segroup8-platform-mysql-data}
  catalog_mysql_data:
    name: ${CATALOG_MYSQL_VOLUME_NAME:-segroup8-catalog-shop-mysql-data}
